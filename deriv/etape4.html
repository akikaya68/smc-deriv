<script>
const ENDPOINTS = [
    'wss://api.derivws.com/trading/v1/options/ws/public',
    'wss://ws.derivws.com/websockets/v3?app_id=1089',
    'wss://green.derivws.com/websockets/v3?app_id=1089',
    'wss://blue.derivws.com/websockets/v3?app_id=1089',
    'wss://red.derivws.com/websockets/v3?app_id=1089'
];
const PING_INTERVAL_MS = 30000;
const CONNECT_TIMEOUT = 6000;
const MAX_CANDLES_PER_REQUEST = 5000;

const FAMILIES = {
    'volatility': { name: '📊 Volatility', indices: ['R_10', 'R_25', 'R_50', 'R_75', 'R_100'] },
    'volatility_1s': { name: '⚡ Volatility 1s', indices: ['1HZ10V', '1HZ15V', '1HZ25V', '1HZ30V', '1HZ50V', '1HZ75V', '1HZ90V', '1HZ100V'] },
    'boom': { name: '💥 Boom', indices: ['BOOM50', 'BOOM150N', 'BOOM300N', 'BOOM500', 'BOOM600', 'BOOM900', 'BOOM1000'] },
    'crash': { name: '📉 Crash', indices: ['CRASH50', 'CRASH150N', 'CRASH300N', 'CRASH500', 'CRASH600', 'CRASH900', 'CRASH1000'] },
    'jump': { name: '⤴️ Jump', indices: ['JD10', 'JD25', 'JD50', 'JD75', 'JD100'] },
    'step': { name: '🪜 Step', indices: ['stpRNG', 'stpRNG2', 'stpRNG3', 'stpRNG4', 'stpRNG5'] },
    'range_break': { name: '📏 Range Break', indices: ['RB100', 'RB200'] },
    'daily_reset': { name: '🌅 Daily Reset', indices: ['RDBULL', 'RDBEAR'] }
};

const state = {
    ws: null, connected: false, connecting: false,
    pingInterval: null, reqId: 1,
    pendingRequests: new Map(),
    currentMode: 'single', running: false
};

function $(id) { return document.getElementById(id); }
function nowTime() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}
function log(msg, type = 'info') {
    const logs = $('logs');
    const line = document.createElement('div');
    line.className = 'log-line';
    line.innerHTML = '<span class="log-time">' + nowTime() + '</span><span class="log-' + type + '">' + escapeHtml(msg) + '</span>';
    logs.appendChild(line);
    logs.scrollTop = logs.scrollHeight;
    while (logs.children.length > 300) logs.removeChild(logs.firstChild);
}
function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function setStatus(status, text, detail) {
    const dot = $('status-dot');
    dot.className = 'dot ' + (status || '');
    $('status-text').textContent = text;
    $('status-detail').textContent = detail || '';
}

async function connect() {
    if (state.connected || state.connecting) return;
    state.connecting = true;
    setStatus('connecting', 'Connexion…', 'Test endpoints');
    for (let i = 0; i < ENDPOINTS.length; i++) {
        const ok = await tryEndpoint(ENDPOINTS[i], i);
        if (ok) {
            state.connected = true;
            state.connecting = false;
            setStatus('connected', 'Connecté ✓', ENDPOINTS[i]);
            log('✅ ' + ENDPOINTS[i], 'success');
            startPing();
            $('btn-run').disabled = false;
            return;
        }
    }
    state.connecting = false;
    setStatus('error', 'Échec', 'Aucun endpoint');
}

function tryEndpoint(url, index) {
    return new Promise(resolve => {
        log('🔌 Test ' + (index + 1) + '/' + ENDPOINTS.length, 'info');
        let ws;
        try { ws = new WebSocket(url); } catch (e) { resolve(false); return; }
        let resolved = false;
        const timeout = setTimeout(() => {
            if (!resolved) { resolved = true; try { ws.close(); } catch (e) {} resolve(false); }
        }, CONNECT_TIMEOUT);
        ws.onopen = () => {
            if (resolved) return;
            resolved = true; clearTimeout(timeout);
            state.ws = ws; attachHandlers(); resolve(true);
        };
        ws.onerror = () => {};
        ws.onclose = () => {
            if (resolved) return;
            resolved = true; clearTimeout(timeout); resolve(false);
        };
    });
}

function attachHandlers() {
    state.ws.onmessage = (event) => {
        let data;
        try { data = JSON.parse(event.data); } catch (e) { return; }
        if (data.msg_type === 'ping' && data.ping === 'pong') return;
        if (data.req_id && state.pendingRequests.has(data.req_id)) {
            const { resolve, reject } = state.pendingRequests.get(data.req_id);
            state.pendingRequests.delete(data.req_id);
            if (data.error) reject(new Error(data.error.message || JSON.stringify(data.error)));
            else resolve(data);
            return;
        }
    };
    state.ws.onclose = (event) => {
        if (event.code === 1000) return;
        log('🔌 Déconnecté (code ' + event.code + ')', 'warn');
        state.connected = false; stopPing();
        setStatus('error', 'Déconnecté', 'Code ' + event.code);
    };
}

function startPing() {
    stopPing();
    state.pingInterval = setInterval(() => {
        if (state.connected && state.ws) {
            try { state.ws.send(JSON.stringify({ ping: 1 })); } catch (e) {}
        }
    }, PING_INTERVAL_MS);
}
function stopPing() {
    if (state.pingInterval) { clearInterval(state.pingInterval); state.pingInterval = null; }
}

function sendRequest(payload, timeoutMs = 30000) {
    if (!state.connected || !state.ws) return Promise.reject(new Error('Non connecté'));
    const reqId = state.reqId++;
    payload.req_id = reqId;
    return new Promise((resolve, reject) => {
        state.pendingRequests.set(reqId, { resolve, reject });
        setTimeout(() => {
            if (state.pendingRequests.has(reqId)) {
                state.pendingRequests.delete(reqId);
                reject(new Error('Timeout'));
            }
        }, timeoutMs);
        try { state.ws.send(JSON.stringify(payload)); }
        catch (e) { state.pendingRequests.delete(reqId); reject(e); }
    });
}

// ══════════════════════════════════════════════════════════════════
// RÉCUPÉRATION MULTI-REQUÊTES (jusqu'à 3 ans)
// ══════════════════════════════════════════════════════════════════
async function fetchCandlesMulti(symbol, granularity, targetCount, onProgress) {
    let allCandles = [];
    let end = 'latest';
    let requestNum = 0;

    while (allCandles.length < targetCount && requestNum < 20) {
        requestNum++;
        const remaining = targetCount - allCandles.length;
        const count = Math.min(MAX_CANDLES_PER_REQUEST, remaining);

        const payload = {
            ticks_history: symbol,
            adjust_start_time: 1,
            count: count,
            end: end,
            start: 1,
            style: 'candles',
            granularity: granularity
        };

        try {
            const res = await sendRequest(payload, 40000);
            if (res.error) throw new Error(res.error.message);
            if (!res.candles || !res.candles.length) break;

            const batch = res.candles.map(c => ({
                epoch: c.epoch,
                open: parseFloat(c.open),
                high: parseFloat(c.high),
                low: parseFloat(c.low),
                close: parseFloat(c.close)
            }));

            // Préfixer (les plus anciennes en premier)
            allCandles = batch.concat(allCandles);
            if (onProgress) onProgress(allCandles.length, targetCount);

            // Si on a reçu moins que demandé → fin de l'historique
            if (batch.length < count) break;

            // Prochain end = timestamp de la plus ancienne bougie - 1
            end = batch[0].epoch - 1;
        } catch (e) {
            log('  ⚠️ Requête ' + requestNum + ' échouée : ' + e.message, 'warn');
            break;
        }

        await new Promise(r => setTimeout(r, 250));
    }

    // Tri par epoch (au cas où)
    allCandles.sort((a, b) => a.epoch - b.epoch);
    return allCandles;
}

// ══════════════════════════════════════════════════════════════════
// INDICATEURS
// ══════════════════════════════════════════════════════════════════
function calculateATR(candles, period = 14) {
    if (candles.length < period + 1) return [];
    const trs = [];
    for (let i = 1; i < candles.length; i++) {
        const tr = Math.max(
            candles[i].high - candles[i].low,
            Math.abs(candles[i].high - candles[i-1].close),
            Math.abs(candles[i].low - candles[i-1].close)
        );
        trs.push(tr);
    }
    const atrs = [];
    let sum = 0;
    for (let i = 0; i < period; i++) sum += trs[i];
    atrs[period - 1] = sum / period;
    for (let i = period; i < trs.length; i++) {
        atrs[i] = (atrs[i-1] * (period - 1) + trs[i]) / period;
    }
    return atrs;
}

function calculateSMA(candles, period) {
    const smas = [];
    for (let i = period - 1; i < candles.length; i++) {
        let sum = 0;
        for (let j = 0; j < period; j++) sum += candles[i - j].close;
        smas[i] = sum / period;
    }
    return smas;
}

function calculateStdDev(candles, period, smas) {
    const stds = [];
    for (let i = period - 1; i < candles.length; i++) {
        const mean = smas[i];
        if (mean === undefined) continue;
        let sumSq = 0;
        for (let j = 0; j < period; j++) {
            const diff = candles[i - j].close - mean;
            sumSq += diff * diff;
        }
        stds[i] = Math.sqrt(sumSq / period);
    }
    return stds;
}

function calculateRSI(candles, period = 14) {
    if (candles.length < period + 1) return [];
    const gains = [], losses = [];
    for (let i = 1; i < candles.length; i++) {
        const diff = candles[i].close - candles[i-1].close;
        gains.push(diff > 0 ? diff : 0);
        losses.push(diff < 0 ? -diff : 0);
    }
    const rsis = [];
    let avgGain = 0, avgLoss = 0;
    for (let i = 0; i < period; i++) { avgGain += gains[i]; avgLoss += losses[i]; }
    avgGain /= period; avgLoss /= period;
    rsis[period] = avgLoss === 0 ? 100 : 100 - (100 / (1 + avgGain / avgLoss));
    for (let i = period + 1; i < candles.length; i++) {
        avgGain = (avgGain * (period - 1) + gains[i-1]) / period;
        avgLoss = (avgLoss * (period - 1) + losses[i-1]) / period;
        rsis[i] = avgLoss === 0 ? 100 : 100 - (100 / (1 + avgGain / avgLoss));
    }
    return rsis;
}

// ══════════════════════════════════════════════════════════════════
// SIMULATION + MÉTRIQUES COMPLÈTES
// ══════════════════════════════════════════════════════════════════
function simulateTrade(candles, startIdx, direction, entry, sl, tp) {
    for (let i = startIdx; i < candles.length; i++) {
        const c = candles[i];
        if (direction === 'buy') {
            if (c.low <= sl) return { result: 'loss', exitReason: 'sl', pips: entry - sl, duration: i - startIdx, entry, sl, tp };
            if (c.high >= tp) return { result: 'win', exitReason: 'tp', pips: tp - entry, duration: i - startIdx, entry, sl, tp };
        } else {
            if (c.high >= sl) return { result: 'loss', exitReason: 'sl', pips: sl - entry, duration: i - startIdx, entry, sl, tp };
            if (c.low <= tp) return { result: 'win', exitReason: 'tp', pips: entry - tp, duration: i - startIdx, entry, sl, tp };
        }
    }
    // Trade ouvert
    const last = candles[candles.length - 1].close;
    const pips = direction === 'buy' ? last - entry : entry - last;
    return {
        result: pips > 0 ? 'win' : 'loss',
        exitReason: 'open',
        pips, duration: candles.length - 1 - startIdx,
        entry, sl, tp, stillOpen: true
    };
}

function calculateStats(trades) {
    if (!trades.length) return emptyStats();

    const wins = trades.filter(t => t.result === 'win' && !t.stillOpen);
    const losses = trades.filter(t => t.result === 'loss' && !t.stillOpen);
    const open = trades.filter(t => t.stillOpen);

    // Séparer TP vs SL vs Open
    const tpTrades = trades.filter(t => t.exitReason === 'tp');
    const slTrades = trades.filter(t => t.exitReason === 'sl');
    const openTrades = trades.filter(t => t.exitReason === 'open');

    const pipsWon = wins.reduce((s, t) => s + t.pips, 0);
    const pipsLost = losses.reduce((s, t) => s + Math.abs(t.pips), 0);
    const totalPips = pipsWon - pipsLost;
    const avgWin = wins.length ? pipsWon / wins.length : 0;
    const avgLoss = losses.length ? pipsLost / losses.length : 0;

    const closedTrades = wins.length + losses.length;
    const winrate = closedTrades > 0 ? Math.round(wins.length / closedTrades * 100) : 0;
    const lossrate = 100 - winrate;

    const profitFactor = pipsLost > 0 ? pipsWon / pipsLost : (pipsWon > 0 ? 99 : 0);
    const expectancy = (winrate / 100) * avgWin - (lossrate / 100) * avgLoss;
    const payoffRatio = avgLoss > 0 ? avgWin / avgLoss : 0;

    // Drawdown max
    let peak = 0, equity = 0, maxDD = 0;
    for (const t of trades) {
        equity += (t.result === 'win' ? t.pips : -Math.abs(t.pips));
        if (equity > peak) peak = equity;
        const dd = peak - equity;
        if (dd > maxDD) maxDD = dd;
    }

    // Streaks
    let maxWinStreak = 0, maxLossStreak = 0, curWin = 0, curLoss = 0;
    for (const t of trades) {
        if (t.result === 'win') { curWin++; curLoss = 0; maxWinStreak = Math.max(maxWinStreak, curWin); }
        else { curLoss++; curWin = 0; maxLossStreak = Math.max(maxLossStreak, curLoss); }
    }

    // Durées
    const durations = trades.map(t => t.duration || 0);
    const avgDuration = durations.length ? durations.reduce((s, d) => s + d, 0) / durations.length : 0;
    const maxDuration = durations.length ? Math.max(...durations) : 0;
    const minDuration = durations.length ? Math.min(...durations) : 0;

    return {
        total: trades.length,
        wins: wins.length,
        losses: losses.length,
        openCount: open.length,
        tpCount: tpTrades.length,
        slCount: slTrades.length,
        winrate, lossrate,
        avgWin: avgWin.toFixed(2),
        avgLoss: avgLoss.toFixed(2),
        totalPips: totalPips.toFixed(2),
        pipsWon: pipsWon.toFixed(2),
        pipsLost: pipsLost.toFixed(2),
        profitFactor: profitFactor.toFixed(2),
        expectancy: expectancy.toFixed(2),
        payoffRatio: payoffRatio.toFixed(2),
        maxDD: maxDD.toFixed(2),
        maxWinStreak, maxLossStreak,
        avgDuration: avgDuration.toFixed(1),
        maxDuration, minDuration
    };
}

function emptyStats() {
    return {
        total: 0, wins: 0, losses: 0, openCount: 0, tpCount: 0, slCount: 0,
        winrate: 0, lossrate: 0, avgWin: '0', avgLoss: '0',
        totalPips: '0', pipsWon: '0', pipsLost: '0',
        profitFactor: '0', expectancy: '0', payoffRatio: '0',
        maxDD: '0', maxWinStreak: 0, maxLossStreak: 0,
        avgDuration: '0', maxDuration: 0, minDuration: 0
    };
}

// ══════════════════════════════════════════════════════════════════
// STRATÉGIE 1 — Range Reversion
// ══════════════════════════════════════════════════════════════════
function strategy1(candles) {
    const rangeBars = 50, atrPeriod = 14, slMult = 1.5;
    const atrs = calculateATR(candles, atrPeriod);
    const trades = [];
    for (let i = rangeBars + atrPeriod; i < candles.length - 1; i++) {
        const window = candles.slice(i - rangeBars, i);
        const rangeHigh = Math.max(...window.map(c => c.high));
        const rangeLow = Math.min(...window.map(c => c.low));
        const rangeMid = (rangeHigh + rangeLow) / 2;
        const current = candles[i].close;
        const atr = atrs[i - 1 - atrPeriod];
        if (!atr || atr <= 0) continue;
        if (current < rangeLow + atr * 0.5) {
            const entry = candles[i + 1].open;
            const sl = entry - atr * slMult;
            trades.push(simulateTrade(candles, i + 1, 'buy', entry, sl, rangeMid));
        } else if (current > rangeHigh - atr * 0.5) {
            const entry = candles[i + 1].open;
            const sl = entry + atr * slMult;
            trades.push(simulateTrade(candles, i + 1, 'sell', entry, sl, rangeMid));
        }
    }
    return calculateStats(trades);
}

// ══════════════════════════════════════════════════════════════════
// STRATÉGIE 2 — Boom/Crash Trend
// ══════════════════════════════════════════════════════════════════
function strategy2(candles, params = {}) {
    const atrPeriod = 14, slMult = 0.8, tpMult = 2.0;
    const symbol = params.symbol || '';
    const atrs = calculateATR(candles, atrPeriod);
    const trades = [];
    const direction = symbol.includes('BOOM') ? 'sell' : 'buy';
    for (let i = atrPeriod + 5; i < candles.length - 1; i++) {
        const atr = atrs[i - 1 - atrPeriod];
        if (!atr || atr <= 0) continue;
        const recent = candles.slice(Math.max(0, i - 5), i);
        const bigMove = recent.some(c => Math.abs(c.close - c.open) > atr * 2);
        if (bigMove) continue;
        const entry = candles[i + 1].open;
        const sl = direction === 'buy' ? entry - atr * slMult : entry + atr * slMult;
        const tp = direction === 'buy' ? entry + atr * tpMult : entry - atr * tpMult;
        trades.push(simulateTrade(candles, i + 1, direction, entry, sl, tp));
    }
    return calculateStats(trades);
}

// ══════════════════════════════════════════════════════════════════
// STRATÉGIE 3 (NOUVELLE) — Bollinger Bands + RSI
// Achat si Close < BB_lower ET RSI < 35
// Vente si Close > BB_upper ET RSI > 65
// TP = Bande médiane (SMA 20)
// SL = ATR × 1.5
// ══════════════════════════════════════════════════════════════════
function strategy3(candles) {
    const bbPeriod = 20, bbMult = 2, rsiPeriod = 14, atrPeriod = 14;
    const smas = calculateSMA(candles, bbPeriod);
    const stds = calculateStdDev(candles, bbPeriod, smas);
    const rsis = calculateRSI(candles, rsiPeriod);
    const atrs = calculateATR(candles, atrPeriod);
    const trades = [];

    const startIdx = Math.max(bbPeriod, rsiPeriod, atrPeriod) + 1;

    for (let i = startIdx; i < candles.length - 1; i++) {
        const sma = smas[i];
        const std = stds[i];
        const rsi = rsis[i];
        const atr = atrs[i - 1 - atrPeriod];
        if (!sma || !std || !rsi || !atr || atr <= 0) continue;

        const upper = sma + bbMult * std;
        const lower = sma - bbMult * std;
        const close = candles[i].close;

        let direction = null;
        // ACHAT : prix sous la bande inférieure + RSI en survente
        if (close < lower && rsi < 35) direction = 'buy';
        // VENTE : prix au-dessus de la bande supérieure + RSI en surachat
        else if (close > upper && rsi > 65) direction = 'sell';

        if (!direction) continue;

        const entry = candles[i + 1].open;
        let sl, tp;
        if (direction === 'buy') {
            sl = entry - atr * 1.5;
            tp = sma; // Retour à la moyenne
            if (tp <= entry) continue;
        } else {
            sl = entry + atr * 1.5;
            tp = sma;
            if (tp >= entry) continue;
        }

        trades.push(simulateTrade(candles, i + 1, direction, entry, sl, tp));
    }
    return calculateStats(trades);
}

// ══════════════════════════════════════════════════════════════════
// STRATÉGIE 4 — Breakout
// ══════════════════════════════════════════════════════════════════
function strategy4(candles) {
    const rangeBars = 100, atrPeriod = 14, slMult = 1.2, tpMult = 2.5;
    const atrs = calculateATR(candles, atrPeriod);
    const trades = [];
    for (let i = rangeBars + atrPeriod; i < candles.length - 1; i++) {
        const window = candles.slice(i - rangeBars, i);
        const rangeHigh = Math.max(...window.map(c => c.high));
        const rangeLow = Math.min(...window.map(c => c.low));
        const current = candles[i];
        const atr = atrs[i - 1 - atrPeriod];
        if (!atr || atr <= 0) continue;
        const isBullBreak = current.close > rangeHigh && (current.close - current.open) > atr * 0.8;
        const isBearBreak = current.close < rangeLow && (current.open - current.close) > atr * 0.8;
        if (isBullBreak) {
            const entry = candles[i + 1].open;
            const sl = entry - atr * slMult;
            const tp = entry + atr * tpMult;
            trades.push(simulateTrade(candles, i + 1, 'buy', entry, sl, tp));
        } else if (isBearBreak) {
            const entry = candles[i + 1].open;
            const sl = entry + atr * slMult;
            const tp = entry - atr * tpMult;
            trades.push(simulateTrade(candles, i + 1, 'sell', entry, sl, tp));
        }
    }
    return calculateStats(trades);
}

// ══════════════════════════════════════════════════════════════════
// STRATÉGIE 5 — SMC (Smart Money Concepts)
// ══════════════════════════════════════════════════════════════════
function strategy5(candles, params = {}) {
    const lookback = 3, atrPeriod = 14, rangeBars = 50, slMult = 1.5, tpMult = 2.5, minRR = 2;
    const atrs = calculateATR(candles, atrPeriod);
    const trades = [];

    function findSwings(start, end) {
        const swings = [];
        for (let i = start + lookback; i < end - lookback; i++) {
            let isHigh = true, isLow = true;
            for (let j = 1; j <= lookback; j++) {
                if (candles[i].high <= candles[i - j].high || candles[i].high <= candles[i + j].high) isHigh = false;
                if (candles[i].low >= candles[i - j].low || candles[i].low >= candles[i + j].low) isLow = false;
            }
            if (isHigh) swings.push({ type: 'high', index: i, price: candles[i].high });
            if (isLow) swings.push({ type: 'low', index: i, price: candles[i].low });
        }
        return swings;
    }

    function findOrderBlock(eventIdx, direction) {
        if (direction === 'bull') {
            for (let i = eventIdx - 1; i >= Math.max(0, eventIdx - 10); i--) {
                if (candles[i].close < candles[i].open) {
                    return { top: Math.max(candles[i].open, candles[i].close), bottom: candles[i].low, index: i };
                }
            }
        } else {
            for (let i = eventIdx - 1; i >= Math.max(0, eventIdx - 10); i--) {
                if (candles[i].close > candles[i].open) {
                    return { top: candles[i].high, bottom: Math.min(candles[i].open, candles[i].close), index: i };
                }
            }
        }
        return null;
    }

    const minStart = Math.max(rangeBars, atrPeriod + lookback * 2) + 1;
    for (let i = minStart; i < candles.length - 2; i++) {
        const atr = atrs[i - 1 - atrPeriod];
        if (!atr || atr <= 0) continue;
        const swings = findSwings(i - rangeBars, i);
        if (swings.length < 4) continue;

        let lastHigh = null, lastLow = null, trend = 'range', lastBOS = null;
        for (const s of swings) {
            if (s.type === 'high') {
                if (lastHigh && s.price > lastHigh.price) {
                    lastBOS = { direction: 'bull', index: s.index, price: s.price };
                    trend = 'bullish';
                }
                lastHigh = s;
            } else {
                if (lastLow && s.price < lastLow.price) {
                    lastBOS = { direction: 'bear', index: s.index, price: s.price };
                    trend = 'bearish';
                }
                lastLow = s;
            }
        }
        if (!lastBOS || lastBOS.index > i - 3) continue;

        const ob = findOrderBlock(lastBOS.index, lastBOS.direction);
        if (!ob) continue;

        const current = candles[i];
        const priceInOB = (lastBOS.direction === 'bull') ?
            (current.low <= ob.top && current.low >= ob.bottom) :
            (current.high >= ob.bottom && current.high <= ob.top);
        if (!priceInOB) continue;

        const rangeWindow = candles.slice(i - rangeBars, i);
        const rangeHigh = Math.max(...rangeWindow.map(c => c.high));
        const rangeLow = Math.min(...rangeWindow.map(c => c.low));
        const eq = (rangeHigh + rangeLow) / 2;
        const zone = current.close > eq ? 'premium' : 'discount';

        let direction = null;
        if (lastBOS.direction === 'bull' && zone === 'discount') direction = 'buy';
        else if (lastBOS.direction === 'bear' && zone === 'premium') direction = 'sell';
        else continue;

        const entry = candles[i + 1].open;
        let sl, tp;
        if (direction === 'buy') {
            sl = ob.bottom - atr * 0.3;
            if (entry - sl < atr * slMult) sl = entry - atr * slMult;
            const risk = entry - sl;
            tp = entry + risk * tpMult;
            if (risk > 0 && (tp - entry) / risk < minRR) continue;
        } else {
            sl = ob.top + atr * 0.3;
            if (sl - entry < atr * slMult) sl = entry + atr * slMult;
            const risk = sl - entry;
            tp = entry - risk * tpMult;
            if (risk > 0 && (entry - tp) / risk < minRR) continue;
        }

        trades.push(simulateTrade(candles, i + 1, direction, entry, sl, tp));
    }
    return calculateStats(trades);
}

const STRATEGIES = [
    { id: 's1', name: 'Stratégie 1', fn: strategy1 },
    { id: 's2', name: 'Stratégie 2', fn: strategy2 },
    { id: 's3', name: 'Stratégie 3', fn: strategy3 },
    { id: 's4', name: 'Stratégie 4', fn: strategy4 },
    { id: 's5', name: 'Stratégie 5', fn: strategy5 }
];

// LANCEMENT DU BACKTEST
// ══════════════════════════════════════════════════════════════════
async function runBacktest() {
    const mode = state.currentMode;
    const granularity = parseInt($('granularity').value);
    const targetCount = parseInt($('count').value);

    let symbols = [];
    if (mode === 'single') symbols = [$('symbol-select').value];
    else if (mode === 'family') symbols = [...FAMILIES[$('family-select').value].indices];
    else for (const fam of Object.values(FAMILIES)) symbols.push(...fam.indices);

    $('btn-run').disabled = true;
    state.running = true;
    $('results').style.display = 'block';
    $('results-container').innerHTML = '';
    $('progress-bar').classList.add('visible');

    log('═══════════════════════════════════════', 'info');
    log('🚀 Backtest : ' + symbols.length + ' indice(s) · 5 stratégies', 'info');
    log('⏱ Granularité : ' + granularity + 's · cible ' + targetCount + ' bougies', 'info');
    log('═══════════════════════════════════════', 'info');

    const allResults = [];
    let processed = 0;

    for (const symbol of symbols) {
        if (!state.running) break;
        $('progress-text').textContent = 'Test ' + (processed + 1) + '/' + symbols.length + ' : ' + symbol;
        $('progress-fill').style.width = ((processed / symbols.length) * 100) + '%';

        try {
            const candles = await fetchCandlesMulti(symbol, granularity, targetCount, (got, target) => {
                $('progress-text').textContent = symbol + ' : ' + got + '/' + target + ' bougies';
            });
            log('📊 ' + symbol + ' → ' + candles.length + ' bougies', 'data');

            const symbolResults = { symbol, strategies: [] };
            for (const strat of STRATEGIES) {
                const stats = strat.fn(candles, { symbol });
                symbolResults.strategies.push({ name: strat.name, stats });
            }
            allResults.push(symbolResults);

            const best = symbolResults.strategies.reduce((a, b) =>
                a.stats.winrate > b.stats.winrate ? a : b
            );
            log('   🏆 ' + best.name + ' (' + best.stats.winrate + '%) · ' + best.stats.total + ' trades', 'success');
        } catch (e) {
            log('   ❌ ' + e.message, 'error');
        }

        processed++;
        await new Promise(r => setTimeout(r, 200));
    }

    $('progress-fill').style.width = '100%';
    $('progress-text').textContent = 'Terminé : ' + symbols.length + ' indices';

    displayResults(allResults);
    state.running = false;
    $('btn-run').disabled = false;
}

// ══════════════════════════════════════════════════════════════════
// AFFICHAGE
// ══════════════════════════════════════════════════════════════════
function displayResults(allResults) {
    const container = $('results-container');

    if (allResults.length === 1) {
        const r = allResults[0];
        const best = r.strategies.reduce((a, b) => a.stats.winrate > b.stats.winrate ? a : b);
        $('summary-best').textContent = best.name + ' → ' + best.stats.winrate + '%';
        container.innerHTML = r.strategies.map(s => renderStrategyCard(s, best.name)).join('');
    } else {
        let bestCombo = { symbol: '—', strategy: '—', wr: 0 };
        let html = '<table class="matrix-table"><thead><tr><th>Indice</th>';
        for (const strat of STRATEGIES) html += '<th>' + strat.name + '</th>';
        html += '</tr></thead><tbody>';

        for (const r of allResults) {
            html += '<tr><td class="symbol">' + escapeHtml(r.symbol) + '</td>';
            for (const s of r.strategies) {
                const wr = s.stats.winrate;
                let cls = 'wr-red';
                if (wr >= 60 && wr <= 90) { cls = 'wr-green'; if (wr > bestCombo.wr) bestCombo = { symbol: r.symbol, strategy: s.name, wr }; }
                else if (wr >= 50) cls = 'wr-blue';
                else if (wr >= 40) cls = 'wr-orange';
                html += '<td class="' + cls + '">' + wr + '%</td>';
            }
            html += '</tr>';
        }
        html += '</tbody></table>';

        $('summary-best').textContent = bestCombo.symbol + ' × ' + bestCombo.strategy + ' → ' + bestCombo.wr + '%';
        container.innerHTML = '<div style="max-height:500px;overflow-y:auto;border-radius:8px;">' + html + '</div>';
    }
}

function renderStrategyCard(s, bestName) {
    const wr = s.stats.winrate;
    let colorClass = 'red', boxClass = 'bad';
    if (wr >= 60 && wr <= 90) { colorClass = 'green'; boxClass = 'best'; }
    else if (wr >= 50) { colorClass = 'blue'; boxClass = 'good'; }
    else if (wr >= 40) { colorClass = 'orange'; boxClass = 'warn'; }

    const isBest = s.name === bestName;
    const bestBadge = isBest ? '<span class="best-badge">MEILLEURE</span>' : '';

    const st = s.stats;
    const pfColor = parseFloat(st.profitFactor) >= 1.5 ? 'green' : parseFloat(st.profitFactor) >= 1 ? 'blue' : 'red';
    const expColor = parseFloat(st.expectancy) > 0 ? 'green' : 'red';

    return '<div class="strategy-card ' + boxClass + '">' +
        '<div class="strategy-header">' +
            '<span class="strategy-name">' + s.name + bestBadge + '</span>' +
            '<span class="strategy-wr ' + colorClass + '">' + wr + '%</span>' +
        '</div>' +
        '<div class="stats-section-title">📊 Trades</div>' +
        '<div class="stats-grid">' +
            '<div class="stat-item"><div class="stat-label">Total</div><div class="stat-value">' + st.total + '</div></div>' +
            '<div class="stat-item"><div class="stat-label">TP</div><div class="stat-value green">' + st.tpCount + '</div></div>' +
            '<div class="stat-item"><div class="stat-label">SL</div><div class="stat-value red">' + st.slCount + '</div></div>' +
            '<div class="stat-item"><div class="stat-label">Ouverts</div><div class="stat-value blue">' + st.openCount + '</div></div>' +
        '</div>' +
        '<div class="stats-section-title">💰 Pips</div>' +
        '<div class="stats-grid">' +
            '<div class="stat-item"><div class="stat-label">Gagnés</div><div class="stat-value green">+' + st.pipsWon + '</div></div>' +
            '<div class="stat-item"><div class="stat-label">Perdus</div><div class="stat-value red">-' + st.pipsLost + '</div></div>' +
            '<div class="stat-item"><div class="stat-label">Nets</div><div class="stat-value ' + (parseFloat(st.totalPips) >= 0 ? 'green' : 'red') + '">' + (parseFloat(st.totalPips) >= 0 ? '+' : '') + st.totalPips + '</div></div>' +
            '<div class="stat-item"><div class="stat-label">Avg Win</div><div class="stat-value">' + st.avgWin + '</div></div>' +
        '</div>' +
        '<div class="stats-section-title">📈 Performance</div>' +
        '<div class="stats-grid">' +
            '<div class="stat-item"><div class="stat-label">Profit Factor</div><div class="stat-value ' + pfColor + '">' + st.profitFactor + '</div></div>' +
            '<div class="stat-item"><div class="stat-label">Expectancy</div><div class="stat-value ' + expColor + '">' + st.expectancy + '</div></div>' +
            '<div class="stat-item"><div class="stat-label">Payoff</div><div class="stat-value">' + st.payoffRatio + '</div></div>' +
            '<div class="stat-item"><div class="stat-label">Max DD</div><div class="stat-value red">-' + st.maxDD + '</div></div>' +
        '</div>' +
        '<div class="stats-section-title">⏱ Streaks & Durées</div>' +
        '<div class="stats-grid">' +
            '<div class="stat-item"><div class="stat-label">Win Streak</div><div class="stat-value green">' + st.maxWinStreak + '</div></div>' +
            '<div class="stat-item"><div class="stat-label">Loss Streak</div><div class="stat-value red">' + st.maxLossStreak + '</div></div>' +
            '<div class="stat-item"><div class="stat-label">Durée moy.</div><div class="stat-value">' + st.avgDuration + ' bougies</div></div>' +
            '<div class="stat-item"><div class="stat-label">Durée max</div><div class="stat-value">' + st.maxDuration + '</div></div>' +
        '</div>' +
    '</div>';
}
