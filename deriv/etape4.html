<script>
// ══════════════════════════════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════════════════════════════
const ENDPOINTS = [
    'wss://api.derivws.com/trading/v1/options/ws/public',
    'wss://ws.derivws.com/websockets/v3?app_id=1089',
    'wss://green.derivws.com/websockets/v3?app_id=1089',
    'wss://blue.derivws.com/websockets/v3?app_id=1089',
    'wss://red.derivws.com/websockets/v3?app_id=1089'
];
const PING_INTERVAL_MS = 30000;
const CONNECT_TIMEOUT = 6000;

const FAMILIES = {
    'volatility': { name: '📊 Volatility', indices: ['R_10', 'R_25', 'R_50', 'R_75', 'R_100'] },
    'volatility_1s': { name: '⚡ Volatility 1s', indices: ['1HZ10V', '1HZ15V', '1HZ25V', '1HZ30V', '1HZ50V', '1HZ75V', '1HZ90V', '1HZ100V'] },
    'boom': { name: '💥 Boom', indices: ['BOOM50', 'BOOM150N', 'BOOM300N', 'BOOM500', 'BOOM600', 'BOOM900', 'BOOM1000'] },
    'crash': { name: '📉 Crash', indices: ['CRASH50', 'CRASH150N', 'CRASH300N', 'CRASH500', 'CRASH600', 'CRASH900', 'CRASH1000'] },
    'jump': { name: '⤴️ Jump', indices: ['JD10', 'JD25', 'JD50', 'JD75', 'JD100'] },
    'step': { name: '🪜 Step', indices: ['stpRNG', 'stpRNG2', 'stpRNG3', 'stpRNG4', 'stpRNG5'] },
    'range_break': { name: '📏 Range Break', indices: ['RB100', 'RB200'] },
    'daily_reset': { name: '🌅 Daily Reset', indices: ['RDBULL', 'RDBEAR'] }
};

const state = {
    ws: null, connected: false, connecting: false,
    pingInterval: null, reqId: 1,
    pendingRequests: new Map(),
    currentMode: 'single', running: false
};

function $(id) { return document.getElementById(id); }
function nowTime() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}
function log(msg, type = 'info') {
    const logs = $('logs');
    const line = document.createElement('div');
    line.className = 'log-line';
    line.innerHTML = '<span class="log-time">' + nowTime() + '</span><span class="log-' + type + '">' + escapeHtml(msg) + '</span>';
    logs.appendChild(line);
    logs.scrollTop = logs.scrollHeight;
    while (logs.children.length > 300) logs.removeChild(logs.firstChild);
}
function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function setStatus(status, text, detail) {
    const dot = $('status-dot');
    dot.className = 'dot ' + (status || '');
    $('status-text').textContent = text;
    $('status-detail').textContent = detail || '';
}

// ══════════════════════════════════════════════════════════════════
// WEBSOCKET
// ══════════════════════════════════════════════════════════════════
async function connect() {
    if (state.connected || state.connecting) return;
    state.connecting = true;
    setStatus('connecting', 'Connexion…', 'Test endpoints');
    for (let i = 0; i < ENDPOINTS.length; i++) {
        const ok = await tryEndpoint(ENDPOINTS[i], i);
        if (ok) {
            state.connected = true;
            state.connecting = false;
            setStatus('connected', 'Connecté ✓', ENDPOINTS[i]);
            log('✅ ' + ENDPOINTS[i], 'success');
            startPing();
            $('btn-run').disabled = false;
            return;
        }
    }
    state.connecting = false;
    setStatus('error', 'Échec', 'Aucun endpoint');
}

function tryEndpoint(url, index) {
    return new Promise(resolve => {
        log('🔌 Test ' + (index + 1) + '/' + ENDPOINTS.length, 'info');
        let ws;
        try { ws = new WebSocket(url); } catch (e) { resolve(false); return; }
        let resolved = false;
        const timeout = setTimeout(() => {
            if (!resolved) { resolved = true; try { ws.close(); } catch (e) {} resolve(false); }
        }, CONNECT_TIMEOUT);
        ws.onopen = () => {
            if (resolved) return;
            resolved = true; clearTimeout(timeout);
            state.ws = ws; attachHandlers(); resolve(true);
        };
        ws.onerror = () => {};
        ws.onclose = () => {
            if (resolved) return;
            resolved = true; clearTimeout(timeout); resolve(false);
        };
    });
}

function attachHandlers() {
    state.ws.onmessage = (event) => {
        let data;
        try { data = JSON.parse(event.data); } catch (e) { return; }
        if (data.msg_type === 'ping' && data.ping === 'pong') return;
        if (data.req_id && state.pendingRequests.has(data.req_id)) {
            const { resolve, reject } = state.pendingRequests.get(data.req_id);
            state.pendingRequests.delete(data.req_id);
            if (data.error) reject(new Error(data.error.message || JSON.stringify(data.error)));
            else resolve(data);
            return;
        }
    };
    state.ws.onclose = (event) => {
        if (event.code === 1000) return;
        log('🔌 Déconnecté (code ' + event.code + ')', 'warn');
        state.connected = false; stopPing();
        setStatus('error', 'Déconnecté', 'Code ' + event.code);
    };
}

function startPing() {
    stopPing();
    state.pingInterval = setInterval(() => {
        if (state.connected && state.ws) {
            try { state.ws.send(JSON.stringify({ ping: 1 })); } catch (e) {}
        }
    }, PING_INTERVAL_MS);
}
function stopPing() {
    if (state.pingInterval) { clearInterval(state.pingInterval); state.pingInterval = null; }
}

function sendRequest(payload, timeoutMs = 25000) {
    if (!state.connected || !state.ws) return Promise.reject(new Error('Non connecté'));
    const reqId = state.reqId++;
    payload.req_id = reqId;
    return new Promise((resolve, reject) => {
        state.pendingRequests.set(reqId, { resolve, reject });
        setTimeout(() => {
            if (state.pendingRequests.has(reqId)) {
                state.pendingRequests.delete(reqId);
                reject(new Error('Timeout'));
            }
        }, timeoutMs);
        try { state.ws.send(JSON.stringify(payload)); }
        catch (e) { state.pendingRequests.delete(reqId); reject(e); }
    });
}

async function fetchCandles(symbol, granularity, count) {
    const payload = {
        ticks_history: symbol,
        adjust_start_time: 1, count: count,
        end: 'latest', start: 1,
        style: 'candles', granularity: granularity
    };
    const res = await sendRequest(payload, 30000);
    if (res.error) throw new Error(res.error.message || JSON.stringify(res.error));
    if (!res.candles) throw new Error('Pas de candles');
    return res.candles.map(c => ({
        epoch: c.epoch,
        open: parseFloat(c.open),
        high: parseFloat(c.high),
        low: parseFloat(c.low),
        close: parseFloat(c.close)
    }));
}

// ══════════════════════════════════════════════════════════════════
// INDICATEURS
// ══════════════════════════════════════════════════════════════════
function calculateATR(candles, period = 14) {
    if (candles.length < period + 1) return [];
    const trs = [];
    for (let i = 1; i < candles.length; i++) {
        const tr = Math.max(
            candles[i].high - candles[i].low,
            Math.abs(candles[i].high - candles[i-1].close),
            Math.abs(candles[i].low - candles[i-1].close)
        );
        trs.push(tr);
    }
    const atrs = [];
    let sum = 0;
    for (let i = 0; i < period; i++) sum += trs[i];
    atrs[period - 1] = sum / period;
    for (let i = period; i < trs.length; i++) {
        atrs[i] = (atrs[i-1] * (period - 1) + trs[i]) / period;
    }
    return atrs;
}

function calculateEMA(candles, period) {
    if (candles.length < period) return [];
    const k = 2 / (period + 1);
    const emas = [];
    let sum = 0;
    for (let i = 0; i < period; i++) sum += candles[i].close;
    emas[period - 1] = sum / period;
    for (let i = period; i < candles.length; i++) {
        emas[i] = candles[i].close * k + emas[i-1] * (1 - k);
    }
    return emas;
}

function calculateRSI(candles, period = 14) {
    if (candles.length < period + 1) return [];
    const gains = [], losses = [];
    for (let i = 1; i < candles.length; i++) {
        const diff = candles[i].close - candles[i-1].close;
        gains.push(diff > 0 ? diff : 0);
        losses.push(diff < 0 ? -diff : 0);
    }
    const rsis = [];
    let avgGain = 0, avgLoss = 0;
    for (let i = 0; i < period; i++) { avgGain += gains[i]; avgLoss += losses[i]; }
    avgGain /= period; avgLoss /= period;
    rsis[period] = avgLoss === 0 ? 100 : 100 - (100 / (1 + avgGain / avgLoss));
    for (let i = period + 1; i < candles.length; i++) {
        avgGain = (avgGain * (period - 1) + gains[i-1]) / period;
        avgLoss = (avgLoss * (period - 1) + losses[i-1]) / period;
        rsis[i] = avgLoss === 0 ? 100 : 100 - (100 / (1 + avgGain / avgLoss));
    }
    return rsis;
}

// ══════════════════════════════════════════════════════════════════
// SIMULATION
// ══════════════════════════════════════════════════════════════════
function simulateTrade(candles, startIdx, direction, entry, sl, tp) {
    for (let i = startIdx; i < candles.length; i++) {
        const c = candles[i];
        if (direction === 'buy') {
            if (c.low <= sl) return { result: 'loss', pips: entry - sl };
            if (c.high >= tp) return { result: 'win', pips: tp - entry };
        } else {
            if (c.high >= sl) return { result: 'loss', pips: sl - entry };
            if (c.low <= tp) return { result: 'win', pips: entry - tp };
        }
    }
    const last = candles[candles.length - 1].close;
    const pips = direction === 'buy' ? last - entry : entry - last;
    return { result: pips > 0 ? 'win' : 'loss', pips };
}

function calculateStats(trades) {
    if (!trades.length) return { total: 0, wins: 0, losses: 0, winrate: 0, avgWin: 0, avgLoss: 0, totalPips: 0 };
    const wins = trades.filter(t => t.result === 'win');
    const losses = trades.filter(t => t.result === 'loss');
    const totalPips = trades.reduce((s, t) => s + (t.result === 'win' ? t.pips : -t.pips), 0);
    const avgWin = wins.length ? wins.reduce((s, t) => s + t.pips, 0) / wins.length : 0;
    const avgLoss = losses.length ? losses.reduce((s, t) => s + t.pips, 0) / losses.length : 0;
    return {
        total: trades.length, wins: wins.length, losses: losses.length,
        winrate: trades.length > 0 ? Math.round(wins.length / trades.length * 100) : 0,
        avgWin: avgWin.toFixed(2), avgLoss: avgLoss.toFixed(2),
        totalPips: totalPips.toFixed(2)
    };
}

// ══════════════════════════════════════════════════════════════════
// STRATÉGIE 1 — Range Reversion
// Achat en bas de range, vente en haut, retour à la moyenne
// ══════════════════════════════════════════════════════════════════
function strategy1(candles, params = {}) {
    const rangeBars = 50, atrPeriod = 14, slMult = 1.5;
    const atrs = calculateATR(candles, atrPeriod);
    const trades = [];
    for (let i = rangeBars + atrPeriod; i < candles.length - 1; i++) {
        const window = candles.slice(i - rangeBars, i);
        const rangeHigh = Math.max(...window.map(c => c.high));
        const rangeLow = Math.min(...window.map(c => c.low));
        const rangeMid = (rangeHigh + rangeLow) / 2;
        const current = candles[i].close;
        const atr = atrs[i - 1 - atrPeriod];
        if (!atr || atr <= 0) continue;
        if (current < rangeLow + atr * 0.5) {
            const entry = candles[i + 1].open;
            const sl = entry - atr * slMult;
            trades.push(simulateTrade(candles, i + 1, 'buy', entry, sl, rangeMid));
        } else if (current > rangeHigh - atr * 0.5) {
            const entry = candles[i + 1].open;
            const sl = entry + atr * slMult;
            trades.push(simulateTrade(candles, i + 1, 'sell', entry, sl, rangeMid));
        }
    }
    return calculateStats(trades);
}

// ══════════════════════════════════════════════════════════════════
// STRATÉGIE 2 — Boom/Crash Trend
// Détecte la direction dominante selon le symbole (Boom → vente, Crash → achat)
// ══════════════════════════════════════════════════════════════════
function strategy2(candles, params = {}) {
    const atrPeriod = 14, slMult = 0.8, tpMult = 2.0;
    const symbol = params.symbol || '';
    const atrs = calculateATR(candles, atrPeriod);
    const trades = [];
    const direction = symbol.includes('BOOM') ? 'sell' : 'buy';
    for (let i = atrPeriod + 5; i < candles.length - 1; i++) {
        const atr = atrs[i - 1 - atrPeriod];
        if (!atr || atr <= 0) continue;
        const recent = candles.slice(Math.max(0, i - 5), i);
        const bigMove = recent.some(c => Math.abs(c.close - c.open) > atr * 2);
        if (bigMove) continue;
        const entry = candles[i + 1].open;
        const sl = direction === 'buy' ? entry - atr * slMult : entry + atr * slMult;
        const tp = direction === 'buy' ? entry + atr * tpMult : entry - atr * tpMult;
        trades.push(simulateTrade(candles, i + 1, direction, entry, sl, tp));
    }
    return calculateStats(trades);
}

// ══════════════════════════════════════════════════════════════════
// STRATÉGIE 3 — Momentum EMA + RSI
// ══════════════════════════════════════════════════════════════════
function strategy3(candles) {
    const emasFast = calculateEMA(candles, 9);
    const emasSlow = calculateEMA(candles, 21);
    const rsis = calculateRSI(candles, 14);
    const atrs = calculateATR(candles, 14);
    const trades = [];
    for (let i = 30; i < candles.length - 1; i++) {
        const ef = emasFast[i], es = emasSlow[i], rsi = rsis[i];
        if (!ef || !es || !rsi) continue;
        const entry = candles[i + 1].open;
        let direction = null;
        if (ef > es && rsi < 30) direction = 'buy';
        else if (ef < es && rsi > 70) direction = 'sell';
        if (!direction) continue;
        const atr = atrs[i - 1 - 14] || (candles[i].high - candles[i].low);
        if (!atr || atr <= 0) continue;
        const sl = direction === 'buy' ? entry - atr * 1.2 : entry + atr * 1.2;
        const tp = direction === 'buy' ? entry + atr * 1.8 : entry - atr * 1.8;
        trades.push(simulateTrade(candles, i + 1, direction, entry, sl, tp));
    }
    return calculateStats(trades);
}

// ══════════════════════════════════════════════════════════════════
// STRATÉGIE 4 — Breakout
// Cassure de range avec momentum
// ══════════════════════════════════════════════════════════════════
function strategy4(candles) {
    const rangeBars = 100, atrPeriod = 14, slMult = 1.2, tpMult = 2.5;
    const atrs = calculateATR(candles, atrPeriod);
    const trades = [];
    for (let i = rangeBars + atrPeriod; i < candles.length - 1; i++) {
        const window = candles.slice(i - rangeBars, i);
        const rangeHigh = Math.max(...window.map(c => c.high));
        const rangeLow = Math.min(...window.map(c => c.low));
        const current = candles[i];
        const atr = atrs[i - 1 - atrPeriod];
        if (!atr || atr <= 0) continue;
        const isBullBreak = current.close > rangeHigh && (current.close - current.open) > atr * 0.8;
        const isBearBreak = current.close < rangeLow && (current.open - current.close) > atr * 0.8;
        if (isBullBreak) {
            const entry = candles[i + 1].open;
            const sl = entry - atr * slMult;
            const tp = entry + atr * tpMult;
            trades.push(simulateTrade(candles, i + 1, 'buy', entry, sl, tp));
        } else if (isBearBreak) {
            const entry = candles[i + 1].open;
            const sl = entry + atr * slMult;
            const tp = entry - atr * tpMult;
            trades.push(simulateTrade(candles, i + 1, 'sell', entry, sl, tp));
        }
    }
    return calculateStats(trades);
}

// ══════════════════════════════════════════════════════════════════
// STRATÉGIE 5 — SMC (Smart Money Concepts)
// Structure BOS/CHoCH + OB + FVG + Sweeps + Premium/Discount
// ══════════════════════════════════════════════════════════════════
function strategy5(candles, params = {}) {
    const lookback = 3;
    const atrPeriod = 14;
    const rangeBars = 50;
    const slMult = 1.5;
    const tpMult = 2.5;
    const minRR = 2;

    const atrs = calculateATR(candles, atrPeriod);
    const trades = [];

    // Détection des swings
    function findSwings(start, end) {
        const swings = [];
        for (let i = start + lookback; i < end - lookback; i++) {
            let isHigh = true, isLow = true;
            for (let j = 1; j <= lookback; j++) {
                if (candles[i].high <= candles[i - j].high || candles[i].high <= candles[i + j].high) isHigh = false;
                if (candles[i].low >= candles[i - j].low || candles[i].low >= candles[i + j].low) isLow = false;
            }
            if (isHigh) swings.push({ type: 'high', index: i, price: candles[i].high });
            if (isLow) swings.push({ type: 'low', index: i, price: candles[i].low });
        }
        return swings;
    }

    // Détection Order Block avant un événement
    function findOrderBlock(eventIdx, direction) {
        if (direction === 'bull') {
            for (let i = eventIdx - 1; i >= Math.max(0, eventIdx - 10); i--) {
                if (candles[i].close < candles[i].open) {
                    return { top: Math.max(candles[i].open, candles[i].close), bottom: candles[i].low, index: i };
                }
            }
        } else {
            for (let i = eventIdx - 1; i >= Math.max(0, eventIdx - 10); i--) {
                if (candles[i].close > candles[i].open) {
                    return { top: candles[i].high, bottom: Math.min(candles[i].open, candles[i].close), index: i };
                }
            }
        }
        return null;
    }

    // Boucle principale
    const minStart = Math.max(rangeBars, atrPeriod + lookback * 2) + 1;
    for (let i = minStart; i < candles.length - 2; i++) {
        const atr = atrs[i - 1 - atrPeriod];
        if (!atr || atr <= 0) continue;

        // Swings passés (non-repaint)
        const swings = findSwings(i - rangeBars, i);
        if (swings.length < 4) continue;

        // Structure : BOS = cassure d'un swing
        let lastHigh = null, lastLow = null;
        let trend = 'range';
        let lastBOS = null;
        for (const s of swings) {
            if (s.type === 'high') {
                if (lastHigh && s.price > lastHigh.price) {
                    lastBOS = { type: 'BOS', direction: 'bull', index: s.index, price: s.price };
                    trend = 'bullish';
                }
                lastHigh = s;
            } else {
                if (lastLow && s.price < lastLow.price) {
                    lastBOS = { type: 'BOS', direction: 'bear', index: s.index, price: s.price };
                    trend = 'bearish';
                }
                lastLow = s;
            }
        }

        if (!lastBOS) continue;
        if (lastBOS.index > i - 3) continue; // BOS trop récent

        // Order Block associé au BOS
        const ob = findOrderBlock(lastBOS.index, lastBOS.direction);
        if (!ob) continue;

        // Vérifier que le prix revient sur l'OB
        const current = candles[i];
        const priceInOB = (lastBOS.direction === 'bull') ?
            (current.low <= ob.top && current.low >= ob.bottom) :
            (current.high >= ob.bottom && current.high <= ob.top);
        if (!priceInOB) continue;

        // Premium/Discount : acheter en discount, vendre en premium
        const rangeWindow = candles.slice(i - rangeBars, i);
        const rangeHigh = Math.max(...rangeWindow.map(c => c.high));
        const rangeLow = Math.min(...rangeWindow.map(c => c.low));
        const eq = (rangeHigh + rangeLow) / 2;
        const zone = current.close > eq ? 'premium' : 'discount';

        let direction = null;
        if (lastBOS.direction === 'bull' && zone === 'discount') direction = 'buy';
        else if (lastBOS.direction === 'bear' && zone === 'premium') direction = 'sell';
        else continue;

        // Entry, SL, TP
        const entry = candles[i + 1].open;
        let sl, tp;
        if (direction === 'buy') {
            sl = ob.bottom - atr * 0.3;
            if (entry - sl < atr * slMult) sl = entry - atr * slMult;
            const risk = entry - sl;
            tp = entry + risk * tpMult;
            // Vérifier RR min
            if (risk > 0 && (tp - entry) / risk < minRR) continue;
        } else {
            sl = ob.top + atr * 0.3;
            if (sl - entry < atr * slMult) sl = entry + atr * slMult;
            const risk = sl - entry;
            tp = entry - risk * tpMult;
            if (risk > 0 && (entry - tp) / risk < minRR) continue;
        }

        trades.push(simulateTrade(candles, i + 1, direction, entry, sl, tp));
    }

    return calculateStats(trades);
}

// ══════════════════════════════════════════════════════════════════
// REGISTRE DES STRATÉGIES
// ══════════════════════════════════════════════════════════════════
const STRATEGIES = [
    { id: 's1', name: 'Stratégie 1', fn: strategy1 },
    { id: 's2', name: 'Stratégie 2', fn: strategy2 },
    { id: 's3', name: 'Stratégie 3', fn: strategy3 },
    { id: 's4', name: 'Stratégie 4', fn: strategy4 },
    { id: 's5', name: 'Stratégie 5', fn: strategy5 }
];

// ══════════════════════════════════════════════════════════════════
// LANCEMENT DU BACKTEST
// ══════════════════════════════════════════════════════════════════
async function runBacktest() {
    const mode = state.currentMode;
    const granularity = parseInt($('granularity').value);
    const count = parseInt($('count').value);

    let symbols = [];
    if (mode === 'single') {
        symbols = [$('symbol-select').value];
    } else if (mode === 'family') {
        const famKey = $('family-select').value;
        symbols = [...FAMILIES[famKey].indices];
    } else {
        for (const fam of Object.values(FAMILIES)) {
            for (const s of fam.indices) symbols.push(s);
        }
    }

    $('btn-run').disabled = true;
    state.running = true;
    $('results').style.display = 'block';
    $('results-container').innerHTML = '';
    $('progress-bar').classList.add('visible');

    log('═══════════════════════════════════════', 'info');
    log('🚀 Backtest : ' + symbols.length + ' indice(s) · ' + STRATEGIES.length + ' stratégies', 'info');
    log('⏱ Granularité : ' + granularity + 's · ' + count + ' bougies', 'info');
    log('═══════════════════════════════════════', 'info');

    const allResults = [];
    let processed = 0;

    for (const symbol of symbols) {
        if (!state.running) break;

        $('progress-text').textContent = 'Test ' + (processed + 1) + '/' + symbols.length + ' : ' + symbol;
        $('progress-fill').style.width = ((processed / symbols.length) * 100) + '%';

        try {
            const candles = await fetchCandles(symbol, granularity, count);
            log('📊 ' + symbol + ' → ' + candles.length + ' bougies', 'data');

            const symbolResults = { symbol, strategies: [] };
            for (const strat of STRATEGIES) {
                const stats = strat.fn(candles, { symbol });
                symbolResults.strategies.push({ name: strat.name, stats });
            }
            allResults.push(symbolResults);

            const best = symbolResults.strategies.reduce((a, b) =>
                a.stats.winrate > b.stats.winrate ? a : b
            );
            log('   🏆 Meilleure : ' + best.name + ' (' + best.stats.winrate + '%)', 'success');
        } catch (e) {
            log('   ❌ ' + e.message, 'error');
        }

        processed++;
        await new Promise(r => setTimeout(r, 300));
    }

    $('progress-fill').style.width = '100%';
    $('progress-text').textContent = 'Terminé : ' + symbols.length + ' indices';

    displayResults(allResults);
    state.running = false;
    $('btn-run').disabled = false;
}

function displayResults(allResults) {
    const container = $('results-container');

    if (allResults.length === 1) {
        // Mode indice unique : afficher les 5 stratégies
        const r = allResults[0];
        const best = r.strategies.reduce((a, b) =>
            (a.stats.winrate >= 60 && a.stats.winrate <= 90 && a.stats.winrate > b.stats.winrate) ? a : b
        );
        $('summary-best').textContent = best.name + ' → ' + best.stats.winrate + '%';

        container.innerHTML = r.strategies.map(s => renderStrategyCard(s, best.name)).join('');
    } else {
        // Mode multi : tableau résumé
        let bestCombo = { symbol: '—', strategy: '—', wr: 0 };
        let html = '<table class="matrix-table"><thead><tr><th>Indice</th>';
        for (const strat of STRATEGIES) html += '<th>' + strat.name + '</th>';
        html += '</tr></thead><tbody>';

        for (const r of allResults) {
            html += '<tr><td class="symbol">' + escapeHtml(r.symbol) + '</td>';
            for (const s of r.strategies) {
                const wr = s.stats.winrate;
                let cls = 'wr-red';
                if (wr >= 60 && wr <= 90) { cls = 'wr-green'; if (wr > bestCombo.wr) bestCombo = { symbol: r.symbol, strategy: s.name, wr }; }
                else if (wr >= 50) cls = 'wr-blue';
                else if (wr >= 40) cls = 'wr-orange';
                html += '<td class="' + cls + '">' + wr + '%</td>';
            }
            html += '</tr>';
        }
        html += '</tbody></table>';

        $('summary-best').textContent = bestCombo.symbol + ' × ' + bestCombo.strategy + ' → ' + bestCombo.wr + '%';
        container.innerHTML = '<div style="max-height:500px;overflow-y:auto;border-radius:8px;">' + html + '</div>';
    }
}

function renderStrategyCard(s, bestName) {
    const wr = s.stats.winrate;
    let colorClass = 'red', boxClass = 'bad';
    if (wr >= 60 && wr <= 90) { colorClass = 'green'; boxClass = 'best'; }
    else if (wr >= 50) { colorClass = 'blue'; boxClass = 'good'; }
    else if (wr >= 40) { colorClass = 'orange'; boxClass = 'warn'; }

    const isBest = s.name === bestName;
    const bestBadge = isBest ? '<span class="best-badge">MEILLEURE</span>' : '';

    return '<div class="strategy-card ' + boxClass + '">' +
        '<div class="strategy-header">' +
            '<span class="strategy-name">' + s.name + bestBadge + '</span>' +
            '<span class="strategy-wr ' + colorClass + '">' + wr + '%</span>' +
        '</div>' +
        '<div class="strategy-stats">' +
            '<span>Trades: <strong>' + s.stats.total + '</strong></span>' +
            '<span>Gains: <strong style="color:#16a34a;">' + s.stats.wins + '</strong></span>' +
            '<span>Pertes: <strong style="color:#dc2626;">' + s.stats.losses + '</strong></span>' +
            '<span>Pips: <strong>' + s.stats.totalPips + '</strong></span>' +
        '</div>' +
    '</div>';
}

document.querySelectorAll('.mode-tab').forEach(tab => {

        state.currentMode = tab.dataset.mode;
        $('single-controls').style.display = state.currentMode === 'single' ? 'block' : 'none';
        $('family-controls').style.display = state.currentMode === 'family' ? 'block' : 'none';

});
