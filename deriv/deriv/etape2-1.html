<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deriv — Chasse aux codes</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0f1419; color: #e8eaed;
        padding: 1rem; font-size: 14px; line-height: 1.5;
        max-width: 900px; margin: 0 auto;
    }
    h1 { font-size: 1.2rem; margin-bottom: 0.3rem; }
    .subtitle { font-size: 0.75rem; color: #9ca3af; margin-bottom: 1rem; }

    .status-box {
        display: flex; align-items: center; gap: 0.6rem;
        padding: 0.9rem 1rem; border-radius: 10px;
        background: #1a2028; border: 1px solid #2d3744;
        margin-bottom: 1rem;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #6b7280; flex-shrink: 0; }
    .dot.connected { background: #16a34a; animation: pulse 2s infinite; }
    .dot.connecting { background: #ea580c; animation: pulse 1s infinite; }
    .dot.error { background: #dc2626; }
    @keyframes pulse { 50% { opacity: 0.4; } }
    .status-text { flex: 1; font-weight: 600; }
    .status-detail { font-size: 0.7rem; color: #9ca3af; }

    .controls { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    button {
        padding: 0.7rem 1.1rem; border-radius: 8px;
        border: 1px solid #2d3744; background: #1a2028;
        color: #e8eaed; font-size: 0.82rem; font-weight: 600;
        cursor: pointer; font-family: inherit;
    }
    button:hover { background: #232b36; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary { background: #16a34a; border-color: #16a34a; color: #fff; }
    button.warn { background: #ea580c; border-color: #ea580c; color: #fff; }

    .section {
        background: #1a2028; border: 1px solid #2d3744;
        border-radius: 10px; padding: 1rem; margin-bottom: 1rem;
    }
    .section-title {
        font-size: 0.72rem; text-transform: uppercase;
        color: #9ca3af; font-weight: 700; letter-spacing: 0.06em;
        margin-bottom: 0.8rem;
    }

    .test-group {
        background: #0f1419; border-radius: 8px;
        padding: 0.8rem; margin-bottom: 0.8rem;
    }
    .test-group-title {
        font-size: 0.75rem; font-weight: 700;
        color: #e8eaed; margin-bottom: 0.5rem;
    }
    .candidate-row {
        display: flex; justify-content: space-between; align-items: center;
        padding: 0.5rem 0.7rem; margin-bottom: 0.3rem;
        background: #1a2028; border-radius: 6px;
        font-family: ui-monospace, monospace; font-size: 0.78rem;
    }
    .candidate-row.found { background: #16a34a22; border: 1px solid #16a34a; }
    .candidate-row.failed { background: #dc262622; border: 1px solid #dc2626; opacity: 0.6; }
    .candidate-row.testing { background: #ea580c22; border: 1px solid #ea580c; }
    .candidate-code { font-weight: 700; }
    .candidate-badge { font-size: 0.7rem; padding: 0.15rem 0.5rem; border-radius: 6px; font-weight: 700; }
    .candidate-badge.active { background: #16a34a; color: #fff; }
    .candidate-badge.inactive { background: #dc2626; color: #fff; }
    .candidate-badge.testing { background: #ea580c; color: #fff; }
    .candidate-badge.unknown { background: #4b5563; color: #d1d5db; }

    .logs {
        background: #0a0f14; border: 1px solid #2d3744;
        border-radius: 8px; padding: 0.8rem;
        font-family: ui-monospace, monospace; font-size: 0.72rem;
        max-height: 250px; overflow-y: auto; line-height: 1.6;
    }
    .log-line { margin-bottom: 0.2rem; word-break: break-all; }
    .log-time { color: #6b7280; margin-right: 0.4rem; }
    .log-info { color: #9ca3af; }
    .log-success { color: #86efac; }
    .log-error { color: #fca5a5; }
    .log-warn { color: #fde68a; }
    .log-data { color: #93c5fd; }
</style>
</head>
<body>

<h1>🔍 Deriv — Chasse aux codes manquants</h1>
<p class="subtitle">Test de multiples variantes pour les 32 indices inactifs</p>

<div class="status-box">
    <div class="dot" id="status-dot"></div>
    <div style="flex:1;">
        <div class="status-text" id="status-text">Déconnecté</div>
        <div class="status-detail" id="status-detail">Prêt à se connecter</div>
    </div>
</div>

<div class="controls">
    <button class="primary" id="btn-hunt">🚀 Lancer la chasse aux codes</button>
    <button class="warn" id="btn-stop" disabled>⏹ Arrêter</button>
</div>

<div class="section" id="results-section" style="display:none;">
    <div class="section-title">📊 Résultats par famille</div>
    <div id="results-container"></div>
</div>

<div class="logs" id="logs"></div>

<script>
// ══════════════════════════════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════════════════════════════
const DERIV_WS_PUBLIC = 'wss://api.derivws.com/trading/v1/options/ws/public';
const PING_INTERVAL_MS = 30000;
const TEST_TIMEOUT_MS = 2500;

// ══════════════════════════════════════════════════════════════════
// CANDIDATS À TESTER PAR FAMILLE
// Format: { label: 'Nom', candidates: ['code1', 'code2', ...] }
// ══════════════════════════════════════════════════════════════════
const HUNT_LIST = [
    {
        label: '🪜 Step Index',
        candidates: ['STPRNG', 'STEPIND', 'STPIDX', 'STEP', 'STP', 'STEP100', 'STEPIDX', 'STEP_IND']
    },
    {
        label: '🚀 High Frequency Volatility',
        candidates: ['JD10', 'JD25', 'JD50', 'JD75', 'JD100', 'HFV10', 'HFV25', 'HFV50', 'HFV75', 'HFV100', 'HFVOL10', 'HFVOL25', 'HFVOL50', 'HFVOL75', 'HFVOL100', 'JD10N', 'JD25N', 'JD50N', 'JD75N', 'JD100N']
    },
    {
        label: '🔄 Drift Switch',
        candidates: ['DSI10', 'DSI20', 'DSI30', 'DRIFT10', 'DRIFT20', 'DRIFT30', 'DS10', 'DS20', 'DS30', 'DRIFTSWITCH10', 'DRIFTSWITCH20', 'DRIFTSWITCH30']
    },
    {
        label: '🎯 DEX',
        candidates: ['DEX600U', 'DEX600D', 'DEX900U', 'DEX900D', 'DEX1500U', 'DEX1500D', 'DEX_600U', 'DEX_600D', 'DEX_900U', 'DEX_900D', 'DEX_1500U', 'DEX_1500D']
    },
    {
        label: '🪜 Multi Step',
        candidates: ['MSC2', 'MSC3', 'MSC4', 'MSTEP2', 'MSTEP3', 'MSTEP4', 'MULTISTEP2', 'MULTISTEP3', 'MULTISTEP4', 'MS2', 'MS3', 'MS4']
    },
    {
        label: '🌊 Vol over Boom',
        candidates: ['VOB400', 'VOB550', 'VOB750', 'VOLOVERBOOM400', 'VOLOVERBOOM550', 'VOLOVERBOOM750', 'VOB_400', 'VOB_550', 'VOB_750']
    },
    {
        label: '🌊 Vol over Crash',
        candidates: ['VOC400', 'VOC550', 'VOC750', 'VOLOVERCRASH400', 'VOLOVERCRASH550', 'VOLOVERCRASH750', 'VOC_400', 'VOC_550', 'VOC_750']
    },
    {
        label: '📐 Skew Step',
        candidates: ['SS4U', 'SS4D', 'SS5U', 'SS5D', 'SKEW4U', 'SKEW4D', 'SKEW5U', 'SKEW5D', 'SKEWSTEP4U', 'SKEWSTEP4D', 'SKEWSTEP5U', 'SKEWSTEP5D']
    },
    {
        label: '🏔️ Trek',
        candidates: ['TRKUP', 'TRKDOWN', 'TREKUP', 'TREKDOWN', 'TRK_UP', 'TRK_DOWN', 'TREK_UP', 'TREK_DOWN']
    },
    {
        label: '🔀 Volatility Switch',
        candidates: ['VSLOW', 'VSMED', 'VSHIGH', 'VOLSWITCH_LOW', 'VOLSWITCH_MED', 'VOLSWITCH_HIGH', 'VSWITCH_LOW', 'VSWITCH_MED', 'VSWITCH_HIGH', 'VS_LOW', 'VS_MED', 'VS_HIGH']
    }
];

// ══════════════════════════════════════════════════════════════════
// ÉTAT
// ══════════════════════════════════════════════════════════════════
const state = {
    ws: null,
    connected: false,
    connecting: false,
    pingInterval: null,
    lastPingSentAt: null,
    reqId: 1,
    pendingRequests: new Map(),
    hunting: false,
    stopRequested: false,
    results: {}, // label → { found: [], failed: [] }
    currentActiveTicks: {}, // code → bool (actif ou non)
    activeSubscriptions: new Set() // codes actuellement abonnés
};

// ══════════════════════════════════════════════════════════════════
// UTILITAIRES
// ══════════════════════════════════════════════════════════════════
function $(id) { return document.getElementById(id); }

function nowTime() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}

function log(msg, type = 'info') {
    const logs = $('logs');
    const line = document.createElement('div');
    line.className = 'log-line';
    line.innerHTML = '<span class="log-time">' + nowTime() + '</span><span class="log-' + type + '">' + escapeHtml(msg) + '</span>';
    logs.appendChild(line);
    logs.scrollTop = logs.scrollHeight;
    while (logs.children.length > 300) logs.removeChild(logs.firstChild);
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function setStatus(status, text, detail) {
    const dot = $('status-dot');
    dot.className = 'dot ' + (status || '');
    $('status-text').textContent = text;
    $('status-detail').textContent = detail || '';
}

// ══════════════════════════════════════════════════════════════════
// WEBSOCKET
// ══════════════════════════════════════════════════════════════════
function connect() {
    if (state.connected || state.connecting) return;
    state.connecting = true;
    setStatus('connecting', 'Connexion…', DERIV_WS_PUBLIC);

    try {
        state.ws = new WebSocket(DERIV_WS_PUBLIC);
    } catch (e) {
        setStatus('error', 'Erreur', e.message);
        state.connecting = false;
        return;
    }

    state.ws.onopen = onOpen;
    state.ws.onmessage = onMessage;
    state.ws.onerror = onError;
    state.ws.onclose = onClose;
}

function onOpen() {
    state.connected = true;
    state.connecting = false;
    setStatus('connected', 'Connecté ✓', 'WebSocket public Deriv');
    log('✅ Connexion établie', 'success');
    startPing();
}

function onMessage(event) {
    let data;
    try { data = JSON.parse(event.data); } catch (e) { return; }

    if (data.msg_type === 'ping' && data.ping === 'pong') {
        if (state.lastPingSentAt) {
            state.lastPingSentAt = null;
        }
        return;
    }

    // Détection de tick → marquer comme actif
    if (data.msg_type === 'tick' && data.tick && data.tick.symbol) {
        const code = data.tick.symbol;
        if (!state.currentActiveTicks[code]) {
            state.currentActiveTicks[code] = true;
            log('  ✅ TICK REÇU de ' + code + ' @ ' + data.tick.quote, 'success');
        }
    }

    // Résoudre les promesses
    if (data.req_id && state.pendingRequests.has(data.req_id)) {
        const { resolve, reject } = state.pendingRequests.get(data.req_id);
        state.pendingRequests.delete(data.req_id);
        resolve(data);
        return;
    }
}

function onError() {
    log('❌ Erreur WebSocket', 'error');
    state.connecting = false;
}

function onClose(event) {
    state.connected = false;
    state.connecting = false;
    stopPing();
    setStatus('', 'Déconnecté', 'Code ' + event.code);
}

function startPing() {
    stopPing();
    sendPing();
    state.pingInterval = setInterval(sendPing, PING_INTERVAL_MS);
}

function stopPing() {
    if (state.pingInterval) { clearInterval(state.pingInterval); state.pingInterval = null; }
}

function sendPing() {
    if (!state.connected || !state.ws) return;
    state.lastPingSentAt = Date.now();
    try { state.ws.send(JSON.stringify({ ping: 1 })); } catch (e) {}
}

function sendRequest(payload, timeoutMs = 5000) {
    if (!state.connected || !state.ws) return Promise.reject(new Error('Non connecté'));
    const reqId = state.reqId++;
    payload.req_id = reqId;
    return new Promise((resolve, reject) => {
        state.pendingRequests.set(reqId, { resolve, reject });
        setTimeout(() => {
            if (state.pendingRequests.has(reqId)) {
                state.pendingRequests.delete(reqId);
                reject(new Error('Timeout'));
            }
        }, timeoutMs);
        try { state.ws.send(JSON.stringify(payload)); }
        catch (e) { state.pendingRequests.delete(reqId); reject(e); }
    });
}

// ══════════════════════════════════════════════════════════════════
// CHASSE AUX CODES
// ══════════════════════════════════════════════════════════════════
async function testCandidate(code) {
    // Reset pour ce code
    state.currentActiveTicks[code] = false;

    try {
        // S'abonner (subscribe: 1)
        const res = await sendRequest({ ticks: code, subscribe: 1 }, 4000);

        // Marquer comme abonné pour cleanup
        if (res && res.subscription && res.subscription.id) {
            state.activeSubscriptions.add(res.subscription.id);
        }

        // Si la réponse contient un tick → actif
        if (res && res.tick && res.tick.symbol) {
            state.currentActiveTicks[res.tick.symbol] = true;
        }

        // Attendre un peu (les ticks arrivent en stream)
        await new Promise(r => setTimeout(r, 800));
        return state.currentActiveTicks[code] === true;
    } catch (e) {
        // Erreur → inactif
        return false;
    }
}

async function cleanupSubscriptions() {
    for (const subId of state.activeSubscriptions) {
        try {
            state.ws.send(JSON.stringify({ forget: subId }));
        } catch (e) {}
    }
    state.activeSubscriptions.clear();
}

async function hunt() {
    if (state.hunting) return;
    state.hunting = true;
    state.stopRequested = false;
    state.results = {};
    state.currentActiveTicks = {};
    $('btn-hunt').disabled = true;
    $('btn-stop').disabled = false;
    $('results-section').style.display = 'block';
    $('results-container').innerHTML = '';

    log('🚀 Début de la chasse aux codes…', 'info');
    log('📊 ' + HUNT_LIST.length + ' familles à tester', 'info');

    for (const group of HUNT_LIST) {
        if (state.stopRequested) {
            log('⏹ Chasse arrêtée par l\'utilisateur', 'warn');
            break;
        }

        log('🔍 Test : ' + group.label, 'info');
        state.results[group.label] = { found: [], failed: [] };

        // Afficher le groupe dans les résultats
        const groupDiv = document.createElement('div');
        groupDiv.className = 'test-group';
        groupDiv.id = 'group-' + group.label.replace(/[^a-z0-9]/gi, '_');
        groupDiv.innerHTML = '<div class="test-group-title">' + group.label + '</div>';
        $('results-container').appendChild(groupDiv);

        let foundOne = false;

        for (const code of group.candidates) {
            if (state.stopRequested) break;
            if (foundOne) break; // On a trouvé, on arrête pour cette famille

            // Afficher la ligne de test
            const row = document.createElement('div');
            row.className = 'candidate-row testing';
            row.id = 'cand-' + code;
            row.innerHTML =
                '<span class="candidate-code">' + escapeHtml(code) + '</span>' +
                '<span class="candidate-badge testing">⏳</span>';
            groupDiv.appendChild(row);

            // Tester
            const isActive = await testCandidate(code);

            // Mettre à jour l'affichage
            row.className = 'candidate-row ' + (isActive ? 'found' : 'failed');
            row.querySelector('.candidate-badge').className = 'candidate-badge ' + (isActive ? 'active' : 'inactive');
            row.querySelector('.candidate-badge').textContent = isActive ? '✅ ACTIF' : '❌';

            if (isActive) {
                state.results[group.label].found.push(code);
                log('  🎯 CODE TROUVÉ : ' + code, 'success');
                foundOne = true;
            }
        }

        if (!foundOne) {
            log('  ❌ Aucun code valide dans cette famille', 'error');
        }

        // Nettoyer les abonnements de ce groupe
        await cleanupSubscriptions();
        await new Promise(r => setTimeout(r, 300));
    }

    log('🏁 Chasse terminée', 'success');
    showSummary();
    state.hunting = false;
    $('btn-hunt').disabled = false;
    $('btn-stop').disabled = true;
}

function showSummary() {
    log('═══════════════════════════════════════', 'info');
    log('📋 RÉSUMÉ DES CODES TROUVÉS', 'success');
    for (const [label, res] of Object.entries(state.results)) {
        if (res.found.length > 0) {
            log('✅ ' + label + ' → ' + res.found.join(', '), 'success');
        } else {
            log('❌ ' + label + ' → aucun code valide', 'error');
        }
    }
    log('═══════════════════════════════════════', 'info');
}

// ══════════════════════════════════════════════════════════════════
// ÉVÉNEMENTS
// ══════════════════════════════════════════════════════════════════
$('btn-hunt').addEventListener('click', () => {
    if (!state.connected) {
        log('⚠️ Attends la connexion…', 'warn');
        return;
    }
    hunt();
});

$('btn-stop').addEventListener('click', () => {
    state.stopRequested = true;
    log('⏹ Demande d\'arrêt…', 'warn');
});

// ══════════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════════
log('🔍 Deriv — Chasse aux codes', 'info');
log('📋 ' + HUNT_LIST.length + ' familles à tester', 'info');
setStatus('', 'Déconnecté', 'Connexion…');

window.addEventListener('load', () => {
    setTimeout(() => { connect(); }, 300);
});
</script>

</body>
</html>
