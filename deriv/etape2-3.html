<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deriv — Fallback automatique</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0f1419; color: #e8eaed;
        padding: 1rem; font-size: 14px; line-height: 1.5;
        max-width: 900px; margin: 0 auto;
    }
    h1 { font-size: 1.2rem; margin-bottom: 0.3rem; }
    .subtitle { font-size: 0.75rem; color: #9ca3af; margin-bottom: 1rem; }

    .status-box {
        display: flex; align-items: center; gap: 0.6rem;
        padding: 0.9rem 1rem; border-radius: 10px;
        background: #1a2028; border: 1px solid #2d3744;
        margin-bottom: 1rem;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #6b7280; flex-shrink: 0; }
    .dot.connected { background: #16a34a; animation: pulse 2s infinite; }
    .dot.connecting { background: #ea580c; animation: pulse 1s infinite; }
    .dot.error { background: #dc2626; }
    @keyframes pulse { 50% { opacity: 0.4; } }
    .status-text { flex: 1; font-weight: 600; }
    .status-detail { font-size: 0.7rem; color: #9ca3af; }

    .controls { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    button {
        padding: 0.7rem 1.1rem; border-radius: 8px;
        border: 1px solid #2d3744; background: #1a2028;
        color: #e8eaed; font-size: 0.82rem; font-weight: 600;
        cursor: pointer; font-family: inherit;
    }
    button:hover { background: #232b36; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary { background: #16a34a; border-color: #16a34a; color: #fff; }
    button.info { background: #2563eb; border-color: #2563eb; color: #fff; }
    button.danger { background: #dc2626; border-color: #dc2626; color: #fff; }

    .endpoint-list {
        background: #0f1419; border-radius: 8px;
        padding: 0.6rem; margin-bottom: 1rem;
        font-size: 0.72rem; font-family: ui-monospace, monospace;
        max-height: 200px; overflow-y: auto;
    }
    .endpoint-item {
        display: flex; align-items: center; gap: 0.5rem;
        padding: 0.3rem 0.5rem;
        border-radius: 4px;
        margin-bottom: 0.2rem;
    }
    .endpoint-item.current { background: #ea580c22; border: 1px solid #ea580c; }
    .endpoint-item.success { background: #16a34a22; border: 1px solid #16a34a; }
    .endpoint-item.failed { background: #dc262622; opacity: 0.5; }
    .endpoint-dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: #6b7280; flex-shrink: 0;
    }
    .endpoint-dot.success { background: #16a34a; }
    .endpoint-dot.failed { background: #dc2626; }
    .endpoint-dot.current { background: #ea580c; animation: pulse 1s infinite; }
    .endpoint-url { flex: 1; word-break: break-all; }

    .stats {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
        gap: 0.5rem; margin-bottom: 1rem;
    }
    .stat {
        padding: 0.6rem; border-radius: 8px;
        background: #1a2028; border: 1px solid #2d3744;
        text-align: center;
    }
    .stat-label { font-size: 0.62rem; color: #9ca3af; text-transform: uppercase; font-weight: 700; }
    .stat-value { font-size: 1rem; font-weight: 700; font-family: ui-monospace, monospace; margin-top: 0.2rem; }
    .stat-value.green { color: #16a34a; }
    .stat-value.blue { color: #2563eb; }
    .stat-value.warn { color: #ea580c; }

    .section {
        background: #1a2028; border: 1px solid #2d3744;
        border-radius: 10px; padding: 1rem; margin-bottom: 1rem;
    }
    .section-title {
        font-size: 0.72rem; text-transform: uppercase;
        color: #9ca3af; font-weight: 700; letter-spacing: 0.06em;
        margin-bottom: 0.8rem;
    }

    .search-input {
        width: 100%; padding: 0.7rem 0.9rem; border-radius: 8px;
        border: 1px solid #2d3744; background: #0f1419; color: #e8eaed;
        font-size: 0.85rem; margin-bottom: 0.7rem;
        font-family: inherit;
    }
    .search-input:focus { outline: none; border-color: #16a34a; }

    .symbol-table {
        max-height: 500px; overflow-y: auto;
        background: #0f1419; border-radius: 8px;
    }
    .symbol-row {
        display: grid;
        grid-template-columns: 100px 1fr 120px;
        gap: 0.5rem;
        padding: 0.5rem 0.7rem;
        border-bottom: 1px solid #1a2028;
        font-size: 0.75rem;
        align-items: center;
    }
    .symbol-row:hover { background: #1a2028; }
    .symbol-code {
        font-family: ui-monospace, monospace;
        font-weight: 700;
        color: #93c5fd;
    }
    .symbol-name { color: #e8eaed; }
    .symbol-market {
        font-size: 0.65rem;
        color: #6b7280;
        text-align: right;
    }
    .symbol-row.synthetic .symbol-code { color: #86efac; }
    .symbol-row.synthetic { background: #052e1633; }

    .logs {
        background: #0a0f14; border: 1px solid #2d3744;
        border-radius: 8px; padding: 0.8rem;
        font-family: ui-monospace, monospace; font-size: 0.72rem;
        max-height: 300px; overflow-y: auto; line-height: 1.6;
    }
    .log-line { margin-bottom: 0.2rem; word-break: break-all; }
    .log-time { color: #6b7280; margin-right: 0.4rem; }
    .log-info { color: #9ca3af; }
    .log-success { color: #86efac; }
    .log-error { color: #fca5a5; }
    .log-warn { color: #fde68a; }
    .log-data { color: #93c5fd; }
</style>
</head>
<body>

<h1>📋 Deriv — Fallback automatique</h1>
<p class="subtitle">Essaie chaque endpoint jusqu'à en trouver un qui marche</p>

<div class="status-box">
    <div class="dot" id="status-dot"></div>
    <div style="flex:1;">
        <div class="status-text" id="status-text">Déconnecté</div>
        <div class="status-detail" id="status-detail">Prêt à se connecter</div>
    </div>
</div>

<div class="section">
    <div class="section-title">🌐 Endpoints à essayer (dans l'ordre)</div>
    <div class="endpoint-list" id="endpoint-list"></div>
</div>

<div class="controls">
    <button class="primary" id="btn-connect">🔌 Lancer le fallback</button>
    <button class="info" id="btn-fetch" disabled>📋 Récupérer les symboles</button>
    <button id="btn-export" disabled>💾 Exporter JSON</button>
    <button class="danger" id="btn-stop" disabled>⏹ Arrêter</button>
</div>

<div class="stats">
    <div class="stat">
        <div class="stat-label">Essai actuel</div>
        <div class="stat-value warn" id="stat-current">—</div>
    </div>
    <div class="stat">
        <div class="stat-label">Total symboles</div>
        <div class="stat-value blue" id="stat-total">—</div>
    </div>
    <div class="stat">
        <div class="stat-label">Synthétiques</div>
        <div class="stat-value green" id="stat-synthetic">—</div>
    </div>
    <div class="stat">
        <div class="stat-label">Forex</div>
        <div class="stat-value" id="stat-forex">—</div>
    </div>
</div>

<div class="section" id="results-section" style="display:none;">
    <div class="section-title">📊 Symboles</div>
    <input type="text" class="search-input" id="search" placeholder="🔍 Rechercher (Step, DEX, Trek, Boom...)">
    <div style="margin-bottom:0.5rem;font-size:0.7rem;color:#9ca3af;">
        <label><input type="checkbox" id="filter-synthetic" checked> Synthétiques uniquement</label>
    </div>
    <div class="symbol-table" id="symbol-table"></div>
</div>

<div class="logs" id="logs"></div>

<script>
// ══════════════════════════════════════════════════════════════════
// LISTE DES ENDPOINTS À TESTER (dans l'ordre)
// ══════════════════════════════════════════════════════════════════
const ENDPOINTS = [
    { url: 'wss://ws.derivws.com/websockets/v3?app_id=1089', label: '🆕 ws.derivws.com (Legacy)' },
    { url: 'wss://green.derivws.com/websockets/v3?app_id=1089', label: '🟢 green.derivws.com' },
    { url: 'wss://blue.derivws.com/websockets/v3?app_id=1089', label: '🔵 blue.derivws.com' },
    { url: 'wss://red.derivws.com/websockets/v3?app_id=1089', label: '🔴 red.derivws.com' },
    { url: 'wss://api.derivws.com/trading/v1/options/ws/public', label: '🆕 api.derivws.com (public)' },
    { url: 'wss://ws.binaryws.com/websockets/v3?app_id=1089', label: '⚠️ ws.binaryws.com (ancien)' }
];

const PING_INTERVAL_MS = 30000;
const CONNECT_TIMEOUT = 5000;  // 5s max par endpoint

const state = {
    ws: null,
    connected: false,
    connecting: false,
    pingInterval: null,
    connectTimeout: null,
    reqId: 1,
    pendingRequests: new Map(),
    allSymbols: [],
    currentEndpointIndex: -1,
    endpointStatus: {}, // index → 'pending' | 'testing' | 'success' | 'failed'
    fallbackRunning: false,
    stopRequested: false,
    succeededEndpoint: null
};

function $(id) { return document.getElementById(id); }
function nowTime() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}
function log(msg, type = 'info') {
    const logs = $('logs');
    const line = document.createElement('div');
    line.className = 'log-line';
    line.innerHTML = '<span class="log-time">' + nowTime() + '</span><span class="log-' + type + '">' + escapeHtml(msg) + '</span>';
    logs.appendChild(line);
    logs.scrollTop = logs.scrollHeight;
    while (logs.children.length > 400) logs.removeChild(logs.firstChild);
}
function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function setStatus(status, text, detail) {
    const dot = $('status-dot');
    dot.className = 'dot ' + (status || '');
    $('status-text').textContent = text;
    $('status-detail').textContent = detail || '';
}

// ══════════════════════════════════════════════════════════════════
// AFFICHAGE DE LA LISTE DES ENDPOINTS
// ══════════════════════════════════════════════════════════════════
function renderEndpointList() {
    const list = $('endpoint-list');
    list.innerHTML = ENDPOINTS.map((ep, i) => {
        const status = state.endpointStatus[i] || 'pending';
        let dotClass = '';
        let extraClass = '';
        if (status === 'testing') { dotClass = 'current'; extraClass = 'current'; }
        else if (status === 'success') { dotClass = 'success'; extraClass = 'success'; }
        else if (status === 'failed') { dotClass = 'failed'; extraClass = 'failed'; }

        return '<div class="endpoint-item ' + extraClass + '">' +
            '<div class="endpoint-dot ' + dotClass + '"></div>' +
            '<div class="endpoint-url">' + escapeHtml(ep.label) + '<br><span style="color:#6b7280;">' + escapeHtml(ep.url) + '</span></div>' +
            '</div>';
    }).join('');
}

// ══════════════════════════════════════════════════════════════════
// CONNEXION À UN ENDPOINT
// ══════════════════════════════════════════════════════════════════
function tryConnect(endpoint, index) {
    return new Promise((resolve, reject) => {
        log('🔌 Test endpoint #' + (index + 1) + ' : ' + endpoint.label, 'info');

        state.currentEndpointIndex = index;
        state.endpointStatus[index] = 'testing';
        $('stat-current').textContent = (index + 1) + '/' + ENDPOINTS.length;
        renderEndpointList();

        let resolved = false;
        let ws;
        try {
            ws = new WebSocket(endpoint.url);
        } catch (e) {
            log('❌ Erreur création WS : ' + e.message, 'error');
            resolve(false);
            return;
        }

        // Timeout de 5 secondes
        const timeout = setTimeout(() => {
            if (!resolved) {
                resolved = true;
                log('⏱ Timeout (' + (CONNECT_TIMEOUT/1000) + 's) — endpoint suivant', 'warn');
                try { ws.close(); } catch (e) {}
                resolve(false);
            }
        }, CONNECT_TIMEOUT);

        ws.onopen = () => {
            if (resolved) return;
            resolved = true;
            clearTimeout(timeout);
            log('✅ Endpoint #' + (index + 1) + ' CONNECTÉ !', 'success');
            state.ws = ws;
            state.connected = true;
            state.endpointStatus[index] = 'success';
            state.succeededEndpoint = endpoint;
            resolve(true);
        };

        ws.onerror = () => {
            // onerror est souvent suivi de onclose, on laisse onclose gérer
        };

        ws.onclose = (event) => {
            if (resolved) return;
            resolved = true;
            clearTimeout(timeout);
            log('❌ Endpoint #' + (index + 1) + ' échoué (code ' + event.code + ')', 'error');
            state.endpointStatus[index] = 'failed';
            resolve(false);
        };
    });
}

// ══════════════════════════════════════════════════════════════════
// FALLBACK AUTOMATIQUE
// ══════════════════════════════════════════════════════════════════
async function runFallback() {
    if (state.fallbackRunning) return;
    state.fallbackRunning = true;
    state.stopRequested = false;
    state.connected = false;
    state.endpointStatus = {};
    state.succeededEndpoint = null;
    state.allSymbols = [];

    $('btn-connect').disabled = true;
    $('btn-stop').disabled = false;
    $('btn-fetch').disabled = true;
    $('btn-export').disabled = true;
    $('results-section').style.display = 'none';

    log('🚀 Début du fallback automatique', 'info');
    log('📋 ' + ENDPOINTS.length + ' endpoints à tester', 'info');

    renderEndpointList();

    for (let i = 0; i < ENDPOINTS.length; i++) {
        if (state.stopRequested) {
            log('⏹ Fallback arrêté par l\'utilisateur', 'warn');
            break;
        }

        const success = await tryConnect(ENDPOINTS[i], i);
        renderEndpointList();

        if (success) {
            // Attacher les handlers
            attachHandlers();
            setStatus('connected', 'Connecté ✓', ENDPOINTS[i].label);
            startPing();
            $('btn-fetch').disabled = false;
            $('btn-export').disabled = false;
            log('═══════════════════════════════════════', 'success');
            log('🎯 ENDPOINT FONCTIONNEL : ' + ENDPOINTS[i].label, 'success');
            log('═══════════════════════════════════════', 'success');
            // Auto-fetch
            setTimeout(() => fetchAllSymbols(), 500);
            state.fallbackRunning = false;
            $('btn-connect').disabled = false;
            $('btn-stop').disabled = true;
            return;
        }

        // Petit délai avant l'endpoint suivant
        if (i < ENDPOINTS.length - 1 && !state.stopRequested) {
            await new Promise(r => setTimeout(r, 500));
        }
    }

    // Aucun endpoint n'a marché
    log('═══════════════════════════════════════', 'error');
    log('❌ AUCUN ENDPOINT FONCTIONNEL', 'error');
    log('💡 Cause probable :', 'warn');
    log('   • FAI (Vodacom/Orange) bloque les WebSocket', 'warn');
    log('   • Réseau mobile instable', 'warn');
    log('   • Essayer en WiFi', 'warn');
    log('   • Essayer avec un VPN', 'warn');
    log('═══════════════════════════════════════', 'error');

    setStatus('error', 'Échec total', 'Aucun endpoint n\'a répondu');
    state.fallbackRunning = false;
    $('btn-connect').disabled = false;
    $('btn-stop').disabled = true;
}

// ══════════════════════════════════════════════════════════════════
// HANDLERS DU WEBSOCKET (attachés après succès)
// ══════════════════════════════════════════════════════════════════
function attachHandlers() {
    if (!state.ws) return;

    state.ws.onmessage = (event) => {
        let data;
        try { data = JSON.parse(event.data); } catch (e) { return; }

        if (data.msg_type === 'ping' && data.ping === 'pong') return;

        if (data.msg_type === 'active_symbols' && data.active_symbols) {
            onActiveSymbols(data.active_symbols);
            return;
        }

        if (data.req_id && state.pendingRequests.has(data.req_id)) {
            const { resolve, reject } = state.pendingRequests.get(data.req_id);
            state.pendingRequests.delete(data.req_id);
            if (data.error) reject(new Error(data.error.message || JSON.stringify(data.error)));
            else resolve(data);
            return;
        }

        if (data.msg_type && data.msg_type !== 'tick') {
            log('📩 ' + data.msg_type, 'info');
        }
    };

    state.ws.onclose = (event) => {
        if (event.code === 1000) return; // fermeture volontaire
        log('🔌 Connexion perdue (code ' + event.code + ')', 'warn');
        state.connected = false;
        stopPing();
        setStatus('error', 'Déconnecté', 'Code ' + event.code);
        $('btn-fetch').disabled = true;
    };

    state.ws.onerror = () => {
        log('❌ Erreur WebSocket', 'error');
    };
}

// ══════════════════════════════════════════════════════════════════
// PING
// ══════════════════════════════════════════════════════════════════
function startPing() {
    stopPing();
    state.pingInterval = setInterval(() => {
        if (state.connected && state.ws) {
            try { state.ws.send(JSON.stringify({ ping: 1 })); } catch (e) {}
        }
    }, PING_INTERVAL_MS);
}
function stopPing() {
    if (state.pingInterval) { clearInterval(state.pingInterval); state.pingInterval = null; }
}

// ══════════════════════════════════════════════════════════════════
// REQUÊTES
// ══════════════════════════════════════════════════════════════════
function sendRequest(payload, timeoutMs = 15000) {
    if (!state.connected || !state.ws) return Promise.reject(new Error('Non connecté'));
    const reqId = state.reqId++;
    payload.req_id = reqId;
    return new Promise((resolve, reject) => {
        state.pendingRequests.set(reqId, { resolve, reject });
        setTimeout(() => {
            if (state.pendingRequests.has(reqId)) {
                state.pendingRequests.delete(reqId);
                reject(new Error('Timeout'));
            }
        }, timeoutMs);
        try { state.ws.send(JSON.stringify(payload)); }
        catch (e) { state.pendingRequests.delete(reqId); reject(e); }
    });
}

async function fetchAllSymbols() {
    log('📋 Demande active_symbols…', 'info');
    try {
        const res = await sendRequest({ active_symbols: 'full' }, 20000);
        if (res.error) {
            log('❌ Erreur API : ' + JSON.stringify(res.error), 'error');
        } else if (res.active_symbols) {
            log('✅ ' + res.active_symbols.length + ' symboles reçus', 'success');
        }
    } catch (e) {
        log('❌ ' + e.message, 'error');
    }
}

// ══════════════════════════════════════════════════════════════════
// TRAITEMENT DES SYMBOLES
// ══════════════════════════════════════════════════════════════════
function onActiveSymbols(symbols) {
    state.allSymbols = symbols;
    $('btn-export').disabled = false;

    const synthetics = symbols.filter(s => s.market === 'synthetic_index');
    const forex = symbols.filter(s => s.market === 'forex');
    const crypto = symbols.filter(s => s.market === 'cryptocurrency');

    $('stat-total').textContent = symbols.length;
    $('stat-synthetic').textContent = synthetics.length;
    $('stat-forex').textContent = forex.length;

    log('═══════════════════════════════════════', 'success');
    log('🎯 ' + synthetics.length + ' SYNTHÉTIQUES TROUVÉS', 'success');
    log('═══════════════════════════════════════', 'success');

    // Grouper par submarket
    const bySubmarket = {};
    for (const s of synthetics) {
        const sub = s.submarket || 'unknown';
        if (!bySubmarket[sub]) bySubmarket[sub] = [];
        bySubmarket[sub].push(s);
    }

    for (const [sub, list] of Object.entries(bySubmarket)) {
        log('▸ ' + sub + ' (' + list.length + ') :', 'info');
        for (const s of list) {
            const name = s.underlying_symbol_name || s.display_name || '?';
            log('   ' + s.underlying_symbol + ' → ' + name, 'data');
        }
    }
    log('═══════════════════════════════════════', 'success');

    $('results-section').style.display = 'block';
    renderSymbols();
}

function renderSymbols() {
    const search = $('search').value.toLowerCase();
    const onlySynthetic = $('filter-synthetic').checked;

    let filtered = state.allSymbols;
    if (onlySynthetic) filtered = filtered.filter(s => s.market === 'synthetic_index');
    if (search) {
        filtered = filtered.filter(s =>
            (s.underlying_symbol || '').toLowerCase().includes(search) ||
            (s.underlying_symbol_name || s.display_name || '').toLowerCase().includes(search) ||
            (s.submarket || '').toLowerCase().includes(search)
        );
    }

    filtered.sort((a, b) => (a.underlying_symbol || '').localeCompare(b.underlying_symbol || ''));

    const table = $('symbol-table');
    if (!filtered.length) {
        table.innerHTML = '<div style="padding:1rem;color:#9ca3af;text-align:center;">Aucun symbole</div>';
        return;
    }

    table.innerHTML = filtered.map(s => {
        const isSynthetic = s.market === 'synthetic_index';
        const name = s.underlying_symbol_name || s.display_name || '?';
        return '<div class="symbol-row ' + (isSynthetic ? 'synthetic' : '') + '">' +
            '<span class="symbol-code">' + escapeHtml(s.underlying_symbol || '?') + '</span>' +
            '<span class="symbol-name">' + escapeHtml(name) + '</span>' +
            '<span class="symbol-market">' + escapeHtml(s.submarket || s.market || '?') + '</span>' +
            '</div>';
    }).join('');
}

function exportJSON() {
    const synthetics = state.allSymbols.filter(s => s.market === 'synthetic_index');
    const exportData = synthetics.map(s => ({
        code: s.underlying_symbol,
        name: s.underlying_symbol_name || s.display_name || '?',
        submarket: s.submarket,
        subgroup: s.subgroup
    }));
    const json = JSON.stringify(exportData, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'deriv_synthetics_' + Date.now() + '.json';
    a.click();
    URL.revokeObjectURL(url);
    log('💾 Export JSON : ' + exportData.length + ' symboles', 'success');
    console.log('=== SYNTHETICS ===');
    console.log(json);
}

// ══════════════════════════════════════════════════════════════════
// ÉVÉNEMENTS
// ══════════════════════════════════════════════════════════════════
$('btn-connect').addEventListener('click', () => {
    runFallback();
});
$('btn-fetch').addEventListener('click', () => {
    if (!state.connected) { log('⚠️ Non connecté', 'warn'); return; }
    fetchAllSymbols();
});
$('btn-export').addEventListener('click', () => {
    if (!state.allSymbols.length) { log('⚠️ Aucun symbole', 'warn'); return; }
    exportJSON();
});
$('btn-stop').addEventListener('click', () => {
    state.stopRequested = true;
    log('⏹ Arrêt demandé…', 'warn');
});
$('search').addEventListener('input', () => { if (state.allSymbols.length) renderSymbols(); });
$('filter-synthetic').addEventListener('change', () => { if (state.allSymbols.length) renderSymbols(); });

// ══════════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════════
log('📋 Deriv — Fallback automatique', 'info');
log('🌐 ' + ENDPOINTS.length + ' endpoints configurés', 'info');
setStatus('', 'Déconnecté', 'Clique sur "Lancer le fallback"');
renderEndpointList();

// Auto-lancer après 1s
window.addEventListener('load', () => {
    setTimeout(() => { runFallback(); }, 1000);
});
</script>
