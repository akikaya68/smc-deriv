<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deriv — Étape 5.2 : Envoi MT5</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0f1419; color: #e8eaed;
        padding: 1rem; font-size: 14px; line-height: 1.5;
        max-width: 900px; margin: 0 auto;
    }
    h1 { font-size: 1.2rem; margin-bottom: 0.3rem; }
    .subtitle { font-size: 0.75rem; color: #9ca3af; margin-bottom: 1rem; }

    .status-box {
        display: flex; align-items: center; gap: 0.6rem;
        padding: 0.9rem 1rem; border-radius: 10px;
        background: #1a2028; border: 1px solid #2d3744;
        margin-bottom: 1rem;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #6b7280; flex-shrink: 0; }
    .dot.connected { background: #16a34a; animation: pulse 2s infinite; }
    .dot.connecting { background: #ea580c; animation: pulse 1s infinite; }

    @keyframes pulse { 50% { opacity: 0.4; } }
    .status-text { flex: 1; font-weight: 600; }
    .status-detail { font-size: 0.7rem; color: #9ca3af; }

    .section {
        background: #1a2028; border: 1px solid #2d3744;
        border-radius: 10px; padding: 1rem; margin-bottom: 1rem;
    }
    .section-title {
        font-size: 0.72rem; text-transform: uppercase;
        color: #9ca3af; font-weight: 700; letter-spacing: 0.06em;
        margin-bottom: 0.8rem;
    }

    label { display: block; font-size: 0.68rem; color: #9ca3af; margin-bottom: 0.3rem; text-transform: uppercase; font-weight: 700; }
    input, select {
        width: 100%; padding: 0.7rem 0.9rem; border-radius: 8px;
        border: 1px solid #2d3744; background: #0f1419; color: #e8eaed;
        font-size: 0.85rem; margin-bottom: 0.7rem; font-family: inherit;
    }
    input:focus { outline: none; border-color: #16a34a; }

    button {
        padding: 0.7rem 1.1rem; border-radius: 8px;
        border: 1px solid #2d3744; background: #1a2028;
        color: #e8eaed; font-size: 0.82rem; font-weight: 600;
        cursor: pointer; font-family: inherit;
        margin-right: 0.3rem; margin-bottom: 0.3rem;
    }
    button:hover { background: #232b36; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary { background: #16a34a; border-color: #16a34a; color: #fff; }
    button.info { background: #2563eb; border-color: #2563eb; color: #fff; }
    button.danger { background: #dc2626; border-color: #dc2626; color: #fff; }

    .stats {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 0.5rem; margin-bottom: 1rem;
    }
    .stat {
        padding: 0.6rem; border-radius: 8px;
        background: #1a2028; border: 1px solid #2d3744;
        text-align: center;
    }
    .stat-label { font-size: 0.6rem; color: #9ca3af; text-transform: uppercase; font-weight: 700; }
    .stat-value { font-size: 0.95rem; font-weight: 700; font-family: ui-monospace, monospace; margin-top: 0.2rem; }
    .stat-value.green { color: #16a34a; }
    .stat-value.red { color: #dc2626; }
    .stat-value.blue { color: #2563eb; }

    .logs {
        background: #0a0f14; border: 1px solid #2d3744;
        border-radius: 8px; padding: 0.8rem;
        font-family: ui-monospace, monospace; font-size: 0.72rem;
        max-height: 350px; overflow-y: auto; line-height: 1.6;
    }
    .log-line { margin-bottom: 0.2rem; word-break: break-all; }
    .log-time { color: #6b7280; margin-right: 0.4rem; }
    .log-info { color: #9ca3af; }
    .log-success { color: #86efac; }
    .log-error { color: #fca5a5; }
    .log-warn { color: #fde68a; }
    .log-data { color: #93c5fd; }
    .log-signal { color: #fbbf24; font-weight: 700; }

    .order-form {
        display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;
    }
    .order-form .full { grid-column: 1 / -1; }

    .mapping-preview {
        padding: 0.6rem 0.8rem;
        background: #0a0f14;
        border-radius: 8px;
        font-size: 0.75rem;
        font-family: ui-monospace, monospace;
        margin-bottom: 0.7rem;
    }
    .mapping-preview .arrow { color: #fbbf24; margin: 0 0.4rem; }
    .mapping-preview .src { color: #93c5fd; }
    .mapping-preview .dst { color: #86efac; font-weight: 700; }
</style>
</head>
<body>

<h1>🔌 Étape 5.2 — Envoi MT5</h1>
<p class="subtitle">Bridge WebSocket → EA MT5 → Exécution (avec mapping automatique)</p>

<!-- STATUT BRIDGE -->
<div class="status-box">

</div>

<!-- LOGS -->
<div class="section">
    <div class="section-title">📋 Logs</div>
    <div class="logs" id="logs"></div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════
// MAPPING DERIV API → MT5 SYMBOL NAMES
// ══════════════════════════════════════════════════════════════════
const SYMBOL_MAP = {
    // Volatility
    'R_10': 'Volatility 10 Index',
    'R_25': 'Volatility 25 Index',
    'R_50': 'Volatility 50 Index',
    'R_75': 'Volatility 75 Index',
    'R_100': 'Volatility 100 Index',
    // Volatility 1s
    '1HZ10V': 'Volatility 10 (1s) Index',
    '1HZ15V': 'Volatility 15 (1s) Index',
    '1HZ25V': 'Volatility 25 (1s) Index',
    '1HZ30V': 'Volatility 30 (1s) Index',
    '1HZ50V': 'Volatility 50 (1s) Index',
    '1HZ75V': 'Volatility 75 (1s) Index',
    '1HZ90V': 'Volatility 90 (1s) Index',
    '1HZ100V': 'Volatility 100 (1s) Index',
    // Boom
    'BOOM50': 'Boom 50 Index',
    'BOOM150N': 'Boom 150 Index',
    'BOOM300N': 'Boom 300 Index',
    'BOOM500': 'Boom 500 Index',
    'BOOM600': 'Boom 600 Index',
    'BOOM900': 'Boom 900 Index',
    'BOOM1000': 'Boom 1000 Index',
    // Crash
    'CRASH50': 'Crash 50 Index',
    'CRASH150N': 'Crash 150 Index',
    'CRASH300N': 'Crash 300 Index',
    'CRASH500': 'Crash 500 Index',
    'CRASH600': 'Crash 600 Index',
    'CRASH900': 'Crash 900 Index',
    'CRASH1000': 'Crash 1000 Index',
    // Jump
    'JD10': 'Jump 10 Index',
    'JD25': 'Jump 25 Index',
    'JD50': 'Jump 50 Index',
    'JD75': 'Jump 75 Index',
    'JD100': 'Jump 100 Index',
    // Step
    'stpRNG': 'Step Index',
    'stpRNG2': 'Step Index 200',
    'stpRNG3': 'Step Index 300',
    'stpRNG4': 'Step Index 400',
    'stpRNG5': 'Step Index 500',
    // Range Break
    'RB100': 'Range Break 100 Index',
    'RB200': 'Range Break 200 Index'
};

// ══════════════════════════════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════════════════════════════
const STORAGE = {
    wsUrl: 'deriv_bridge_ws_url_v3',
    wsToken: 'deriv_bridge_ws_token_v3'
};

const state = {
    ws: null,
    connected: false,
    reqId: 1,
    lastTicket: null,
    orderTimeout: null
};

function $(id) { return document.getElementById(id); }
function nowTime() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}
function log(msg, type = 'info') {
    const logs = $('logs');
    const line = document.createElement('div');
    line.className = 'log-line';
    line.innerHTML = '<span class="log-time">' + nowTime() + '</span><span class="log-' + type + '">' + escapeHtml(msg) + '</span>';
    logs.appendChild(line);
    logs.scrollTop = logs.scrollHeight;
    while (logs.children.length > 300) logs.removeChild(logs.firstChild);
}
function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function setWsStatus(status, text, detail) {
    const dot = $('ws-dot');
    dot.className = 'dot ' + (status || '');
    $('ws-status').textContent = text;
    $('ws-detail').textContent = detail || '';
    $('stat-ws').textContent = status === 'connected' ? '🟢' : status === 'connecting' ? '🟠' : status === 'error' ? '🔴' : '⚪';
}

// ══════════════════════════════════════════════════════════════════
// MAPPING PREVIEW
// ══════════════════════════════════════════════════════════════════
function updateMappingPreview() {
    const derivCode = $('order-symbol').value;
    const mt5Name = SYMBOL_MAP[derivCode] || derivCode;
    $('mapping-preview').innerHTML =
        '<span class="src">' + escapeHtml(derivCode) + '</span>' +
        '<span class="arrow">→</span>' +
        '<span class="dst">' + escapeHtml(mt5Name) + '</span>';
}

// ══════════════════════════════════════════════════════════════════
// CONNEXION WEBSOCKET
// ══════════════════════════════════════════════════════════════════
function connect() {
    if (state.ws) {
        try { state.ws.close(); } catch (e) {}
    }

    const url = $('ws-url').value.trim();
    if (!url) {
        log('❌ URL WebSocket manquante', 'error');
        return;
    }

    localStorage.setItem(STORAGE.wsUrl, url);
    localStorage.setItem(STORAGE.wsToken, $('ws-token').value.trim());

    setWsStatus('connecting', 'Connexion…', url);
    log('🔌 Connexion à ' + url, 'info');

    try {
        state.ws = new WebSocket(url);
    } catch (e) {
        log('❌ Erreur : ' + e.message, 'error');
        setWsStatus('error', 'Erreur', e.message);
        return;
    }

    state.ws.onopen = () => {
        state.connected = true;
        setWsStatus('connected', 'Connecté ✓', url);
        log('✅ Bridge connecté', 'success');
        $('btn-connect').disabled = true;
        $('btn-disconnect').disabled = false;
        setTimeout(() => sendMessage({ type: 'get_status' }), 500);
    };

    state.ws.onmessage = (event) => {
        let data;
        try { data = JSON.parse(event.data); } catch (e) {
            log('📩 Reçu (non-JSON) : ' + event.data.slice(0, 100), 'data');
            return;
        }
        handleMessage(data);
    };

    state.ws.onerror = () => {
        log('❌ Erreur WebSocket', 'error');
    };

    state.ws.onclose = (event) => {
        state.connected = false;
        setWsStatus('', 'Déconnecté', 'Code ' + event.code);
        log('🔌 Déconnecté (code ' + event.code + ')', 'warn');
        $('btn-connect').disabled = false;
        $('btn-disconnect').disabled = true;
    };
}

function disconnect() {
    if (state.ws) {
        state.ws.close(1000, 'User disconnect');
        state.ws = null;
    }
}

function sendMessage(payload) {
    if (!state.connected || !state.ws) {
        log('⚠️ Non connecté', 'warn');
        return false;
    }
    try {
        state.ws.send(JSON.stringify(payload));
        log('📤 Envoyé : ' + JSON.stringify(payload).slice(0, 200), 'info');
        return true;
    } catch (e) {
        log('❌ Erreur envoi : ' + e.message, 'error');
        return false;
    }
}

// ══════════════════════════════════════════════════════════════════
// TRAITEMENT DES MESSAGES
// ══════════════════════════════════════════════════════════════════
function handleMessage(data) {
    log('📩 Reçu : type=' + (data.type || '?'), 'data');

    // CAS 1 : open_order = réponse directe (peut être erreur ou confirmation)
    if (data.type === 'open_order') {
        if (data.status === 'error') {
            log('❌ ORDRE REJETÉ', 'error');
            log('   → Erreur : ' + (data.error || 'Inconnue'), 'error');
            if (data.error_code) log('   → Code : ' + data.error_code, 'error');
            if (state.orderTimeout) { clearTimeout(state.orderTimeout); state.orderTimeout = null; }
        } else if (data.status === 'ok') {
            log('✅ Ordre confirmé par MT5', 'success');
            if (data.ticket) {
                log('   → Ticket : ' + data.ticket, 'signal');
                $('stat-ticket').textContent = data.ticket;
                $('stat-ticket').className = 'stat-value green';
                state.lastTicket = data.ticket;
            }
        } else {
            log('   → ' + JSON.stringify(data).slice(0, 250), 'data');
        }
        return;
    }

    // CAS 2 : messages standards
    switch (data.type) {
        case 'welcome':
            log('   → Welcome (v' + data.version + ')', 'success');
            $('stat-ea').textContent = data.ea_connected ? '🟢 OUI' : '🔴 NON';
            $('stat-account').textContent = data.account || '—';
            break;

        case 'pong':
            break;

        case 'status':
            $('stat-ea').textContent = data.ea_connected ? '🟢 OUI' : '🔴 NON';
            $('stat-queue').textContent = data.queue_length || 0;
            $('stat-account').textContent = data.account || '—';
            log('   → EA=' + data.ea_connected + ' | Queue=' + data.queue_length, 'data');
            break;

        case 'order_pending':
            log('   → Ordre en attente (request_id=' + data.request_id + ')', 'warn');
            break;

        case 'order_executed':
            log('🎉 ORDRE EXÉCUTÉ !', 'signal');
            log('   → Ticket MT5 : ' + data.ticket, 'signal');
            log('   → Symbole : ' + data.symbol, 'data');
            log('   → Action : ' + data.action, 'data');
            log('   → Prix : ' + data.price, 'data');
            log('   → Volume : ' + data.volume, 'data');
            log('   → SL : ' + data.sl, 'data');
            log('   → TP : ' + data.tp, 'data');
            $('stat-ticket').textContent = data.ticket;
            $('stat-ticket').className = 'stat-value green';
            state.lastTicket = data.ticket;
            if (state.orderTimeout) { clearTimeout(state.orderTimeout); state.orderTimeout = null; }
            break;

        case 'order_rejected':
            log('❌ ORDRE REJETÉ : ' + data.error, 'error');
            if (state.orderTimeout) { clearTimeout(state.orderTimeout); state.orderTimeout = null; }
            break;

        // get_account response
        case 'get_account':
            log('   → Compte reçu', 'success');
            if (data.login) {
                log('      Login : ' + data.login, 'data');
                log('      Nom : ' + data.name, 'data');
                log('      Balance : ' + (data.balance || '—'), 'data');
                log('      Devise : ' + (data.currency || '—'), 'data');
                log('      Serveur : ' + (data.server || '—'), 'data');
                log('      Levier : ' + (data.leverage || '—'), 'data');
            }
            break;

        // get_positions response
        case 'get_positions':
            log('   → ' + (data.count || 0) + ' position(s)', 'success');
            if (data.positions && data.positions.length) {
                for (const p of data.positions) {
                    log('      #' + p.ticket + ' ' + p.symbol + ' ' + p.type + ' ' + p.volume + ' lots @ ' + p.price_open, 'data');
                }
            }
            break;

        // account_pending / positions_pending
        case 'account_pending':
        case 'positions_pending':
            log('   → En attente de la réponse...', 'warn');
            break;

        case 'error':
            log('❌ Erreur : ' + data.error, 'error');
            break;

        default:
            log('   → ' + JSON.stringify(data).slice(0, 250), 'data');
    }
}

// ══════════════════════════════════════════════════════════════════
// ENVOI D'ORDRE (avec mapping automatique)
// ══════════════════════════════════════════════════════════════════
function sendOrder() {
    if (!state.connected) {
        log('⚠️ Bridge non connecté', 'warn');
        return;
    }

    const derivCode = $('order-symbol').value;
    const mt5Name = SYMBOL_MAP[derivCode] || derivCode;

    if (!SYMBOL_MAP[derivCode]) {
        log('⚠️ Pas de mapping pour ' + derivCode + ' → envoi brut', 'warn');
    }

    const requestId = 'req_' + Date.now() + '_' + Math.floor(Math.random() * 1000);

    const msg = {
        type: 'open_order',
        request_id: requestId,
        order: {
            symbol: mt5Name,
            direction: $('order-direction').value,
            lot: parseFloat($('order-volume').value) || 0.01,
            sl_points: 0,
            tp_points: 0,
            comment: $('order-comment').value || 'SMC Trader'
        }
    };

    log('🚀 Envoi ordre : ' + derivCode + ' → ' + mt5Name, 'signal');
    log('   Direction : ' + msg.order.direction + ' | Lot : ' + msg.order.lot, 'data');

    // Timeout de sécurité 15s
    if (state.orderTimeout) clearTimeout(state.orderTimeout);
    state.orderTimeout = setTimeout(() => {
        log('⏱️ Timeout : pas de réponse du bridge (15s)', 'error');
        state.orderTimeout = null;
    }, 15000);

    sendMessage(msg);
}

// ══════════════════════════════════════════════════════════════════
// ÉVÉNEMENTS
// ══════════════════════════════════════════════════════════════════
$('btn-connect').addEventListener('click', connect);
$('btn-disconnect').addEventListener('click', disconnect);
$('btn-send-order').addEventListener('click', sendOrder);
$('btn-test-status').addEventListener('click', () => sendMessage({ type: 'get_status' }));
$('btn-test-account').addEventListener('click', () => sendMessage({ type: 'get_account' }));
$('btn-test-positions').addEventListener('click', () => sendMessage({ type: 'get_positions' }));
$('order-symbol').addEventListener('change', updateMappingPreview);

// Charger la config sauvegardée
try {
    const savedUrl = localStorage.getItem(STORAGE.wsUrl);
    const savedToken = localStorage.getItem(STORAGE.wsToken);
    if (savedUrl) $('ws-url').value = savedUrl;
    if (savedToken) $('ws-token').value = savedToken;
} catch (e) {}

// Pré-remplir avec l'URL actuelle
if (!$('ws-url').value) {
    $('ws-url').value = 'wss://starting-peas-stop-seafood.trycloudflare.com';
    $('ws-token').value = 'smc_v5_MonTokenSecret_2026_xK9pL3mNqR7vT5';
}

// ══════════════════════════════════════════════════════════════════
// INIT
