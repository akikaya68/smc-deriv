<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deriv — Étape 3 : Bougies</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0f1419; color: #e8eaed;
        padding: 1rem; font-size: 14px; line-height: 1.5;
        max-width: 900px; margin: 0 auto;
    }
    h1 { font-size: 1.2rem; margin-bottom: 0.3rem; }
    .subtitle { font-size: 0.75rem; color: #9ca3af; margin-bottom: 1rem; }

    .status-box {
        display: flex; align-items: center; gap: 0.6rem;
        padding: 0.9rem 1rem; border-radius: 10px;
        background: #1a2028; border: 1px solid #2d3744;
        margin-bottom: 1rem;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #6b7280; flex-shrink: 0; }
    .dot.connected { background: #16a34a; animation: pulse 2s infinite; }
    .dot.connecting { background: #ea580c; animation: pulse 1s infinite; }
    .dot.error { background: #dc2626; }
    @keyframes pulse { 50% { opacity: 0.4; } }
    .status-text { flex: 1; font-weight: 600; }
    .status-detail { font-size: 0.7rem; color: #9ca3af; }

    .controls { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    button {
        padding: 0.7rem 1.1rem; border-radius: 8px;
        border: 1px solid #2d3744; background: #1a2028;
        color: #e8eaed; font-size: 0.82rem; font-weight: 600;
        cursor: pointer; font-family: inherit;
    }
    button:hover { background: #232b36; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary { background: #16a34a; border-color: #16a34a; color: #fff; }
    button.info { background: #2563eb; border-color: #2563eb; color: #fff; }

    .section {
        background: #1a2028; border: 1px solid #2d3744;
        border-radius: 10px; padding: 1rem; margin-bottom: 1rem;
    }
    .section-title {
        font-size: 0.72rem; text-transform: uppercase;
        color: #9ca3af; font-weight: 700; letter-spacing: 0.06em;
        margin-bottom: 0.8rem;
    }
    label { display: block; font-size: 0.68rem; color: #9ca3af; margin-bottom: 0.3rem; text-transform: uppercase; font-weight: 700; }
    select, input {
        width: 100%; padding: 0.7rem 0.9rem; border-radius: 8px;
        border: 1px solid #2d3744; background: #0f1419; color: #e8eaed;
        font-size: 0.85rem; margin-bottom: 0.7rem; font-family: inherit;
    }
    select:focus, input:focus { outline: none; border-color: #16a34a; }
    .control-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; }

    .candle-stats {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
        gap: 0.5rem; margin-bottom: 1rem;
    }
    .stat {
        padding: 0.6rem; border-radius: 8px;
        background: #1a2028; border: 1px solid #2d3744;
        text-align: center;
    }
    .stat-label { font-size: 0.62rem; color: #9ca3af; text-transform: uppercase; font-weight: 700; }
    .stat-value { font-size: 1rem; font-weight: 700; font-family: ui-monospace, monospace; margin-top: 0.2rem; }

    .candles-container {
        background: #0a0f14; border-radius: 8px;
        padding: 0.5rem; height: 300px;
        position: relative; margin-bottom: 1rem;
    }
    .candles-container canvas { width: 100%; height: 100%; display: block; }

    .candle-list {
        max-height: 300px; overflow-y: auto;
        background: #0a0f14; border-radius: 8px;
        padding: 0.4rem;
    }
    .candle-row {
        display: grid; grid-template-columns: 120px 1fr 1fr 1fr 1fr;
        gap: 0.5rem; padding: 0.4rem 0.6rem;
        font-size: 0.7rem; font-family: ui-monospace, monospace;
        border-bottom: 1px solid #1a2028;
    }
    .candle-row:last-child { border-bottom: none; }
    .candle-row.bull { border-left: 3px solid #16a34a; }
    .candle-row.bear { border-left: 3px solid #dc2626; }
    .c-open { color: #93c5fd; }
    .c-high { color: #86efac; }
    .c-low { color: #fca5a5; }
    .c-close { color: #e8eaed; font-weight: 700; }

    .logs {
        background: #0a0f14; border: 1px solid #2d3744;
        border-radius: 8px; padding: 0.8rem;
        font-family: ui-monospace, monospace; font-size: 0.72rem;
        max-height: 250px; overflow-y: auto; line-height: 1.6;
    }
    .log-line { margin-bottom: 0.2rem; word-break: break-all; }
    .log-time { color: #6b7280; margin-right: 0.4rem; }
    .log-info { color: #9ca3af; }
    .log-success { color: #86efac; }
    .log-error { color: #fca5a5; }
    .log-warn { color: #fde68a; }
    .log-data { color: #93c5fd; }
</style>
</head>
<body>

<h1>📈 Deriv — Étape 3 : Bougies</h1>
<p class="subtitle">Récupération des bougies historiques (ticks_history)</p>

<div class="status-box">
    <div class="dot" id="status-dot"></div>
    <div style="flex:1;">
        <div class="status-text" id="status-text">Déconnecté</div>
        <div class="status-detail" id="status-detail">Connexion automatique…</div>
    </div>
</div>

<div class="section">
    <div class="section-title">⚙️ Paramètres</div>
    <label>Indice</label>
    <select id="symbol-select">
        <option value="R_75" selected>Volatility 75 Index (R_75)</option>
        <option value="R_10">Volatility 10 Index (R_10)</option>
        <option value="R_25">Volatility 25 Index (R_25)</option>
        <option value="R_50">Volatility 50 Index (R_50)</option>
        <option value="R_100">Volatility 100 Index (R_100)</option>
        <option value="1HZ100V">Volatility 100 (1s) Index</option>
        <option value="1HZ75V">Volatility 75 (1s) Index</option>
        <option value="BOOM500">Boom 500 Index</option>
        <option value="BOOM1000">Boom 1000 Index</option>
        <option value="CRASH500">Crash 500 Index</option>
        <option value="CRASH1000">Crash 1000 Index</option>
        <option value="JD10">Jump 10 Index</option>
        <option value="JD100">Jump 100 Index</option>
        <option value="stpRNG">Step Index 100</option>
        <option value="RB100">Range Break 100 Index</option>
        <option value="RDBULL">Bull Market Index</option>
        <option value="RDBEAR">Bear Market Index</option>
    </select>

    <div class="control-grid">
        <div>
            <label>Granularité</label>
            <select id="granularity">
                <option value="60">1 min (M1)</option>
                <option value="300" selected>5 min (M5)</option>
                <option value="900">15 min (M15)</option>
                <option value="3600">1 heure (H1)</option>
                <option value="14400">4 heures (H4)</option>
                <option value="86400">1 jour (D1)</option>
            </select>
        </div>
        <div>
            <label>Nombre de bougies</label>
            <input type="number" id="count" value="200" min="10" max="5000">
        </div>
        <div>
            <label>Style</label>
            <select id="style">
                <option value="candles" selected>Candles (OHLC)</option>
                <option value="ticks">Ticks bruts</option>
            </select>
        </div>
    </div>
</div>

<div class="controls">
    <button class="primary" id="btn-fetch">📥 Récupérer les bougies</button>
    <button class="info" id="btn-test">🧪 Test rapide (10 bougies)</button>
</div>

<div class="candle-stats" id="candle-stats" style="display:none;">
    <div class="stat">
        <div class="stat-label">Bougies</div>
        <div class="stat-value" id="stat-count">—</div>
    </div>
    <div class="stat">
        <div class="stat-label">Plus haut</div>
        <div class="stat-value" id="stat-high">—</div>
    </div>
    <div class="stat">
        <div class="stat-label">Plus bas</div>
        <div class="stat-value" id="stat-low">—</div>
    </div>
    <div class="stat">
        <div class="stat-label">Range</div>
        <div class="stat-value" id="stat-range">—</div>
    </div>
</div>

<div class="section" id="chart-section" style="display:none;">
    <div class="section-title">📈 Graphique</div>
    <div class="candles-container">
        <canvas id="candles-canvas"></canvas>
    </div>
</div>

<div class="section" id="list-section" style="display:none;">
    <div class="section-title">📋 Détail des bougies (dernières 20)</div>
    <div class="candle-list" id="candle-list"></div>
</div>

<div class="logs" id="logs"></div>

<script>
const ENDPOINTS = [
    'wss://api.derivws.com/trading/v1/options/ws/public',
    'wss://ws.derivws.com/websockets/v3?app_id=1089',
    'wss://green.derivws.com/websockets/v3?app_id=1089',
    'wss://blue.derivws.com/websockets/v3?app_id=1089',
    'wss://red.derivws.com/websockets/v3?app_id=1089'
];
const PING_INTERVAL_MS = 30000;
const CONNECT_TIMEOUT = 6000;

const state = {
    ws: null,
    connected: false,
    connecting: false,
    pingInterval: null,
    reqId: 1,
    pendingRequests: new Map(),
    candles: []
};

function $(id) { return document.getElementById(id); }
function nowTime() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}
function log(msg, type = 'info') {
    const logs = $('logs');
    const line = document.createElement('div');
    line.className = 'log-line';
    line.innerHTML = '<span class="log-time">' + nowTime() + '</span><span class="log-' + type + '">' + escapeHtml(msg) + '</span>';
    logs.appendChild(line);
    logs.scrollTop = logs.scrollHeight;
    while (logs.children.length > 300) logs.removeChild(logs.firstChild);
}
function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function setStatus(status, text, detail) {
    const dot = $('status-dot');
    dot.className = 'dot ' + (status || '');
    $('status-text').textContent = text;
    $('status-detail').textContent = detail || '';
}

async function connect() {
    if (state.connected || state.connecting) return;
    state.connecting = true;
    setStatus('connecting', 'Connexion…', 'Test endpoints');
    for (let i = 0; i < ENDPOINTS.length; i++) {
        const ok = await tryEndpoint(ENDPOINTS[i], i);
        if (ok) {
            state.connected = true;
            state.connecting = false;
            setStatus('connected', 'Connecté ✓', ENDPOINTS[i]);
            log('✅ ' + ENDPOINTS[i], 'success');
            startPing();
            return;
        }
    }
    state.connecting = false;
    setStatus('error', 'Échec', 'Aucun endpoint');
}

function tryEndpoint(url, index) {
    return new Promise(resolve => {
        log('🔌 Test ' + (index + 1) + '/' + ENDPOINTS.length, 'info');
        let ws;
        try { ws = new WebSocket(url); } catch (e) { resolve(false); return; }
        let resolved = false;
        const timeout = setTimeout(() => {
            if (!resolved) { resolved = true; try { ws.close(); } catch (e) {} resolve(false); }
        }, CONNECT_TIMEOUT);
        ws.onopen = () => {
            if (resolved) return;
            resolved = true;
            clearTimeout(timeout);
            state.ws = ws;
            attachHandlers();
            resolve(true);
        };
        ws.onerror = () => {};
        ws.onclose = () => {
            if (resolved) return;
            resolved = true;
            clearTimeout(timeout);
            resolve(false);
        };
    });
}

function attachHandlers() {
    state.ws.onmessage = (event) => {
        let data;
        try { data = JSON.parse(event.data); } catch (e) { return; }
        if (data.msg_type === 'ping' && data.ping === 'pong') return;
        if (data.req_id && state.pendingRequests.has(data.req_id)) {
            const { resolve, reject } = state.pendingRequests.get(data.req_id);
            state.pendingRequests.delete(data.req_id);
            if (data.error) reject(new Error(data.error.message || JSON.stringify(data.error)));
            else resolve(data);
            return;
        }
    };
    state.ws.onclose = (event) => {
        if (event.code === 1000) return;
        log('🔌 Déconnecté (code ' + event.code + ')', 'warn');
        state.connected = false;
        stopPing();
        setStatus('error', 'Déconnecté', 'Code ' + event.code);
    };
    state.ws.onerror = () => {};
}

function startPing() {
    stopPing();
    state.pingInterval = setInterval(() => {
        if (state.connected && state.ws) {
            try { state.ws.send(JSON.stringify({ ping: 1 })); } catch (e) {}
        }
    }, PING_INTERVAL_MS);
}
function stopPing() {
    if (state.pingInterval) { clearInterval(state.pingInterval); state.pingInterval = null; }
}

function sendRequest(payload, timeoutMs = 15000) {
    if (!state.connected || !state.ws) return Promise.reject(new Error('Non connecté'));
    const reqId = state.reqId++;
    payload.req_id = reqId;
    return new Promise((resolve, reject) => {
        state.pendingRequests.set(reqId, { resolve, reject });
        setTimeout(() => {
            if (state.pendingRequests.has(reqId)) {
                state.pendingRequests.delete(reqId);
                reject(new Error('Timeout'));
            }
        }, timeoutMs);
        try { state.ws.send(JSON.stringify(payload)); }
        catch (e) { state.pendingRequests.delete(reqId); reject(e); }
    });
}

// ══════════════════════════════════════════════════════════════════
// RÉCUPÉRATION DES BOUGIES (subscribe retiré)
// ══════════════════════════════════════════════════════════════════
async function fetchCandles(symbol, granularity, count, style) {
    log('📥 ' + symbol + ' · ' + granularity + 's · ' + count + ' bougies · ' + style, 'info');

    const payload = {
        ticks_history: symbol,
        adjust_start_time: 1,
        count: count,
        end: 'latest',
        start: 1,
        style: style
    };

    if (style === 'candles') {
        payload.granularity = granularity;
    }

    const res = await sendRequest(payload, 20000);

    if (res.error) {
        throw new Error(res.error.message || JSON.stringify(res.error));
    }

    log('📦 Clés : ' + Object.keys(res).join(', '), 'data');

    if (style === 'candles' && res.candles) {
        return res.candles.map(c => ({
            epoch: c.epoch,
            open: parseFloat(c.open),
            high: parseFloat(c.high),
            low: parseFloat(c.low),
            close: parseFloat(c.close)
        }));
    }

    if (style === 'ticks' && res.history) {
        const times = res.history.times || [];
        const prices = res.history.prices || [];
        return times.map((t, i) => ({
            epoch: t,
            open: prices[i],
            high: prices[i],
            low: prices[i],
            close: prices[i]
        }));
    }

    throw new Error('Format inattendu. Clés : ' + Object.keys(res).join(', '));
}

async function doFetch() {
    const symbol = $('symbol-select').value;
    const granularity = parseInt($('granularity').value);
    const count = parseInt($('count').value);
    const style = $('style').value;

    $('btn-fetch').disabled = true;
    try {
        const candles = await fetchCandles(symbol, granularity, count, style);
        state.candles = candles;
        log('✅ ' + candles.length + ' bougies reçues', 'success');
        displayCandles(candles);
    } catch (e) {
        log('❌ ' + e.message, 'error');
    } finally {
        $('btn-fetch').disabled = false;
    }
}

async function doQuickTest() {
    $('symbol-select').value = 'R_75';
    $('granularity').value = '300';
    $('count').value = '10';
    $('style').value = 'candles';
    await doFetch();
}

// ══════════════════════════════════════════════════════════════════
// AFFICHAGE
// ══════════════════════════════════════════════════════════════════
function displayCandles(candles) {
    if (!candles.length) {
        log('⚠️ Aucune bougie', 'warn');
        return;
    }

    const highs = candles.map(c => c.high);
    const lows = candles.map(c => c.low);
    const maxHigh = Math.max(...highs);
    const minLow = Math.min(...lows);

    $('candle-stats').style.display = 'grid';
    $('stat-count').textContent = candles.length;
    $('stat-high').textContent = maxHigh.toFixed(4);
    $('stat-low').textContent = minLow.toFixed(4);
    $('stat-range').textContent = (maxHigh - minLow).toFixed(4);

    $('chart-section').style.display = 'block';
    drawCandles(candles);

    $('list-section').style.display = 'block';
    renderCandleList(candles.slice(-20).reverse());
}

function drawCandles(candles) {
    const canvas = $('candles-canvas');
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    const W = rect.width, H = rect.height;

    ctx.clearRect(0, 0, W, H);

    const visible = candles.slice(-100);
    const margin = { top: 10, right: 70, bottom: 20, left: 10 };
    const plotW = W - margin.left - margin.right;
    const plotH = H - margin.top - margin.bottom;

    const allHigh = Math.max(...visible.map(c => c.high));
    const allLow = Math.min(...visible.map(c => c.low));
    const padding = (allHigh - allLow) * 0.05 || 1;
    const yMax = allHigh + padding;
    const yMin = allLow - padding;

    const candleWidth = plotW / visible.length;
    const bodyWidth = candleWidth * 0.7;
    const xScale = i => margin.left + i * candleWidth + candleWidth / 2;
    const yScale = p => margin.top + plotH - ((p - yMin) / (yMax - yMin)) * plotH;

    ctx.strokeStyle = '#2d3744';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i <= 4; i++) {
        const y = margin.top + i * plotH / 4;
        ctx.moveTo(margin.left, y);
        ctx.lineTo(margin.left + plotW, y);
    }
    ctx.stroke();

    ctx.fillStyle = '#9ca3af';
    ctx.font = '9px -apple-system, sans-serif';
    ctx.textAlign = 'left';
    for (let i = 0; i <= 4; i++) {
        const price = yMax - (i * (yMax - yMin) / 4);
        const y = margin.top + i * plotH / 4;
        ctx.fillText(price.toFixed(4), margin.left + plotW + 4, y + 3);
    }

    visible.forEach((c, i) => {
        const x = xScale(i);
        const bullish = c.close >= c.open;
        const color = bullish ? '#16a34a' : '#dc2626';
        const openY = yScale(c.open);
        const closeY = yScale(c.close);
        const highY = yScale(c.high);
        const lowY = yScale(c.low);

        ctx.strokeStyle = color;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, highY);
        ctx.lineTo(x, lowY);
        ctx.stroke();

        ctx.fillStyle = color;
        const bodyTop = Math.min(openY, closeY);
        const bodyHeight = Math.max(1, Math.abs(closeY - openY));
        ctx.fillRect(x - bodyWidth / 2, bodyTop, bodyWidth, bodyHeight);
    });
}

function renderCandleList(candles) {
    const list = $('candle-list');
    list.innerHTML = candles.map(c => {
        const bullish = c.close >= c.open;
        const time = new Date(c.epoch * 1000).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
        return '<div class="candle-row ' + (bullish ? 'bull' : 'bear') + '">' +
            '<span>' + time + '</span>' +
            '<span class="c-open">O ' + c.open.toFixed(4) + '</span>' +
            '<span class="c-high">H ' + c.high.toFixed(4) + '</span>' +
            '<span class="c-low">L ' + c.low.toFixed(4) + '</span>' +
            '<span class="c-close">C ' + c.close.toFixed(4) + '</span>' +
            '</div>';
    }).join('');
}

// ══════════════════════════════════════════════════════════════════
// ÉVÉNEMENTS
// ══════════════════════════════════════════════════════════════════
$('btn-fetch').addEventListener('click', doFetch);
$('btn-test').addEventListener('click', doQuickTest);

// ══════════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════════
log('📈 Étape 3 : Bougies historiques', 'info');
setStatus('', 'Déconnecté', 'Connexion auto…');

window.addEventListener('load', () => {
    setTimeout(() => { connect(); }, 500);
});
</script>

</body>
</html>
