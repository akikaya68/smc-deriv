// ══════════════════════════════════════════════════════════════════
// ÉTAT
// ══════════════════════════════════════════════════════════════════
const state = {
    ws: null,
    connected: false,
    connecting: false,
    pingInterval: null,
    reconnectAttempts: 0,
    reconnectTimer: null,
    lastPingSentAt: null,
    reqId: 1,
    pendingRequests: new Map(),
    selectedFamily: null,
    selectedIndex: null,
    activeIndices: {},
    ticksSubscriptionId: null,
    testTimeouts: new Map(),
    testedCount: 0,
    testingInProgress: false
};

// ══════════════════════════════════════════════════════════════════
// UTILITAIRES
// ══════════════════════════════════════════════════════════════════
function $(id) { return document.getElementById(id); }

function nowTime() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}

function log(msg, type = 'info') {
    const logs = $('logs');
    const line = document.createElement('div');
    line.className = 'log-line';
    line.innerHTML = '<span class="log-time">' + nowTime() + '</span><span class="log-' + type + '">' + escapeHtml(msg) + '</span>';
    logs.appendChild(line);
    logs.scrollTop = logs.scrollHeight;
    while (logs.children.length > 200) logs.removeChild(logs.firstChild);
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function setStatus(status, text, detail) {
    const dot = $('status-dot');
    dot.className = 'dot ' + (status || '');
    $('status-text').textContent = text;
    $('status-detail').textContent = detail || '';
    $('stat-state').textContent = status === 'connected' ? '🟢 ON' : status === 'connecting' ? '🟠 …' : status === 'error' ? '🔴 ERR' : '⚪ OFF';
    $('stat-state').className = 'stat-value ' + (status === 'connected' ? 'green' : status === 'error' ? 'red' : '');
}

function updateStats() {
    let active = 0, inactive = 0;
    for (const code in state.activeIndices) {
        if (state.activeIndices[code].active) active++;
        else if (state.activeIndices[code].tested) inactive++;
    }
    $('stat-active').textContent = active;
    $('stat-inactive').textContent = inactive;
    $('stat-tested').textContent = state.testedCount;
}

// ══════════════════════════════════════════════════════════════════
// WEBSOCKET
// ══════════════════════════════════════════════════════════════════
function connect() {
    if (state.connected || state.connecting) return;
    state.connecting = true;
    setStatus('connecting', 'Connexion…', DERIV_WS_PUBLIC);
    log('🔌 Connexion à ' + DERIV_WS_PUBLIC, 'info');

    try {
        state.ws = new WebSocket(DERIV_WS_PUBLIC);
    } catch (e) {
        log('❌ Erreur : ' + e.message, 'error');
        state.connecting = false;
        setStatus('error', 'Erreur', e.message);
        return;
    }

    state.ws.onopen = onOpen;
    state.ws.onmessage = onMessage;
    state.ws.onerror = onError;
    state.ws.onclose = onClose;
}

function onOpen() {
    state.connected = true;
    state.connecting = false;
    state.reconnectAttempts = 0;
    setStatus('connected', 'Connecté ✓', 'WebSocket public Deriv');
    log('✅ Connexion établie', 'success');
    startPing();
    // Lancer le test auto après 1s
    setTimeout(() => testAllIndices(), 1000);
}

function onMessage(event) {
    let data;
    try { data = JSON.parse(event.data); } catch (e) { return; }

    // Pong
    if (data.msg_type === 'ping' && data.ping === 'pong') {
        if (state.lastPingSentAt) {
            $('stat-ping').textContent = Date.now() - state.lastPingSentAt;
            state.lastPingSentAt = null;
        }
        return;
    }

    // Tick → mettre à jour l'état de l'indice + afficher
    if (data.msg_type === 'tick' && data.tick) {
        markIndexActive(data.tick.symbol);
        if (state.selectedIndex && state.selectedIndex.code === data.tick.symbol) {
            showTick(data.tick);
        }
    }

    // Résoudre pending
    if (data.req_id && state.pendingRequests.has(data.req_id)) {
        const { resolve, reject } = state.pendingRequests.get(data.req_id);
        state.pendingRequests.delete(data.req_id);
        if (data.error) {
            // Si erreur "Symbol not found" → marquer inactif
            if (data.error.code === 'InvalidSymbol' || data.error.message?.includes('not found')) {
                if (data.req_id && data.echo_req?.ticks) {
                    markIndexTested(data.echo_req.ticks, false);
                }
            }
            reject(new Error(data.error.message || JSON.stringify(data.error)));
        } else {
            // Si la réponse contient déjà un tick → marquer actif
            if (data.tick && data.tick.symbol) {
                markIndexActive(data.tick.symbol);
            }
            resolve(data);
        }
        return;
    }
}

function onError() {
    log('❌ Erreur WebSocket', 'error');
    state.connecting = false;
}

function onClose(event) {
    const wasConnected = state.connected;
    state.connected = false;
    state.connecting = false;
    stopPing();
    log('🔌 Déconnecté (code ' + event.code + ')', wasConnected ? 'warn' : 'info');

    if (wasConnected && event.code !== 1000 && state.reconnectAttempts < 10) {
        state.reconnectAttempts++;
        const delay = Math.min(1000 * Math.pow(2, state.reconnectAttempts - 1), 30000);
        log('🔄 Reconnexion dans ' + (delay/1000).toFixed(1) + 's', 'warn');
        state.reconnectTimer = setTimeout(connect, delay);
    } else {
        setStatus('', 'Déconnecté', 'Clique sur Connecter');
    }
}

function startPing() {
    stopPing();
    sendPing();
    state.pingInterval = setInterval(sendPing, PING_INTERVAL_MS);
}

function stopPing() {
    if (state.pingInterval) { clearInterval(state.pingInterval); state.pingInterval = null; }
}

function sendPing() {
    if (!state.connected || !state.ws) return;
    state.lastPingSentAt = Date.now();
    try { state.ws.send(JSON.stringify({ ping: 1 })); } catch (e) {}
}

function sendRequest(payload, timeoutMs = 8000) {
    if (!state.connected || !state.ws) return Promise.reject(new Error('Non connecté'));
    const reqId = state.reqId++;
    payload.req_id = reqId;
    return new Promise((resolve, reject) => {
        state.pendingRequests.set(reqId, { resolve, reject });
        setTimeout(() => {
            if (state.pendingRequests.has(reqId)) {
                state.pendingRequests.delete(reqId);
                reject(new Error('Timeout'));
            }
        }, timeoutMs);
        try { state.ws.send(JSON.stringify(payload)); }
        catch (e) { state.pendingRequests.delete(reqId); reject(e); }
    });
}

// ══════════════════════════════════════════════════════════════════
// GESTION DE L'ÉTAT DES INDICES
// ══════════════════════════════════════════════════════════════════
function markIndexActive(code) {
    if (!state.activeIndices[code]) state.activeIndices[code] = {};
    if (!state.activeIndices[code].active) {
        state.activeIndices[code].active = true;
        state.activeIndices[code].tested = true;
        state.testedCount++;
    }
    state.activeIndices[code].lastSeenAt = Date.now();
    updateIndexBadge(code);
    updateStats();
    updateFamilySelectCounts();
}

function markIndexTested(code, active) {
    if (!state.activeIndices[code]) state.activeIndices[code] = {};
    state.activeIndices[code].active = !!active;
    if (!state.activeIndices[code].tested) {
        state.activeIndices[code].tested = true;
        state.testedCount++;
    }
    updateIndexBadge(code);
    updateStats();
    updateFamilySelectCounts();
}

// ══════════════════════════════════════════════════════════════════
// TEST D'ACTIVITÉ
// ══════════════════════════════════════════════════════════════════
async function testIndex(code) {
    // Déjà testé et actif → skip
    if (state.activeIndices[code]?.active) return;
    // Marquer comme en test
    if (!state.activeIndices[code]) state.activeIndices[code] = {};
    state.activeIndices[code].testing = true;
    updateIndexBadge(code);

    try {
        // Utiliser subscribe: 1 → Deriv envoie un tick immédiatement
        const res = await sendRequest({ ticks: code, subscribe: 1 }, TEST_TIMEOUT_MS + 2000);

        // Le tick arrive dans la réponse OU dans onMessage → on devrait déjà l'avoir marqué
        // Si pas de tick dans la réponse, on regarde quand même
        if (res.tick && res.tick.symbol) {
            markIndexActive(res.tick.symbol);
        }

        // Se désabonner immédiatement (on ne veut pas garder le flux)
        if (res.subscription && res.subscription.id) {
            try { state.ws.send(JSON.stringify({ forget: res.subscription.id })); } catch (e) {}
        }

        // Si toujours pas marqué actif après 2.5s → inactif
        setTimeout(() => {
            if (!state.activeIndices[code]?.active) {
                markIndexTested(code, false);
            }
        }, TEST_TIMEOUT_MS);
    } catch (e) {
        // Erreur → inactif
        markIndexTested(code, false);
    }
}

async function testAllIndices() {
    if (!state.connected) return;
    if (state.testingInProgress) return;
    state.testingInProgress = true;

    const allCodes = [];
    for (const fam of Object.values(SYNTHETIC_FAMILIES)) {
        for (const idx of fam.indices) allCodes.push(idx.code);
    }

    log('🧪 Test auto de ' + allCodes.length + ' indices (en arrière-plan)…', 'info');

    let tested = 0;
    for (let i = 0; i < allCodes.length; i += TEST_BATCH_SIZE) {
        if (!state.connected) break;
        const batch = allCodes.slice(i, i + TEST_BATCH_SIZE);
        for (const code of batch) testIndex(code);
        await new Promise(r => setTimeout(r, TEST_BATCH_DELAY));
        tested += batch.length;
        // Log tous les 12 tests
        if (tested % 12 === 0) {
            const act = Object.values(state.activeIndices).filter(x => x.active).length;
            log('  → ' + tested + '/' + allCodes.length + ' testés · ' + act + ' actifs', 'data');
        }
    }

    log('🧪 Test auto terminé · ' + Object.values(state.activeIndices).filter(x => x.active).length + ' actifs', 'success');
    state.testingInProgress = false;
    renderFamilySelect();
    if (state.selectedFamily) renderIndexList(state.selectedFamily);
}

// ══════════════════════════════════════════════════════════════════
// UI
// ══════════════════════════════════════════════════════════════════
function renderFamilySelect() {
    const sel = $('family-select');
    const current = sel.value;
    sel.innerHTML = '<option value="">— Choisir une famille —</option>';
    for (const [key, fam] of Object.entries(SYNTHETIC_FAMILIES)) {
        const activeCount = fam.indices.filter(i => state.activeIndices[i.code]?.active).length;
        const totalCount = fam.indices.length;
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = fam.icon + ' ' + fam.name + ' (' + activeCount + '/' + totalCount + ' actifs)';
        sel.appendChild(opt);
    }
    if (current) sel.value = current;
}

function updateFamilySelectCounts() {
    const sel = $('family-select');
    for (let i = 0; i < sel.options.length; i++) {
        const opt = sel.options[i];
        if (!opt.value) continue;
        const fam = SYNTHETIC_FAMILIES[opt.value];
        if (!fam) continue;
        const activeCount = fam.indices.filter(x => state.activeIndices[x.code]?.active).length;
        opt.textContent = fam.icon + ' ' + fam.name + ' (' + activeCount + '/' + fam.indices.length + ' actifs)';
    }
}

function renderIndexList(familyKey) {
    const fam = SYNTHETIC_FAMILIES[familyKey];
    if (!fam) return;
    const list = $('index-list');
    list.innerHTML = '';

    for (const idx of fam.indices) {
        const item = document.createElement('div');
        item.className = 'index-item';
        item.dataset.code = idx.code;
        if (state.selectedIndex && state.selectedIndex.code === idx.code) {
            item.classList.add('selected');
        }
        const info = state.activeIndices[idx.code];
        let badge = '';
        if (!info || !info.tested) badge = '<span class="badge unknown">⏳</span>';
        else if (info.testing && !info.active) badge = '<span class="badge testing">⏳</span>';
        else if (info.active) badge = '<span class="badge active">✅</span>';
        else badge = '<span class="badge inactive">❌</span>';

        item.innerHTML =
            '<div>' +
                '<span class="index-name">' + escapeHtml(idx.name) + '</span>' +
                '<span class="index-code">' + escapeHtml(idx.code) + '</span>' +
            '</div>' +
            badge;

        item.addEventListener('click', () => selectIndex(idx));
        list.appendChild(item);
    }
}

function updateIndexBadge(code) {
    const item = document.querySelector('.index-item[data-code="' + code + '"]');
    if (!item) return;
    const info = state.activeIndices[code];
    const badge = item.querySelector('.badge');
    if (!badge) return;
    badge.className = 'badge';
    if (!info || !info.tested) { badge.classList.add('unknown'); badge.textContent = '⏳'; }
    else if (info.testing && !info.active) { badge.classList.add('testing'); badge.textContent = '⏳'; }
    else if (info.active) { badge.classList.add('active'); badge.textContent = '✅'; }
    else { badge.classList.add('inactive'); badge.textContent = '❌'; }
}

async function selectIndex(idx) {
    document.querySelectorAll('.index-item').forEach(el => el.classList.remove('selected'));
    const item = document.querySelector('.index-item[data-code="' + idx.code + '"]');
    if (item) item.classList.add('selected');

    // Se désabonner de l'ancien
    if (state.ticksSubscriptionId) {
        try { state.ws.send(JSON.stringify({ forget: state.ticksSubscriptionId })); } catch (e) {}
        state.ticksSubscriptionId = null;
    }

    state.selectedIndex = idx;
    $('ticks-box').classList.add('visible');
    $('ticks-title').textContent = '📈 ' + idx.name + ' (' + idx.code + ') — Ticks temps réel';
    $('ticks-list').innerHTML = '';

    log('📈 Abonnement à ' + idx.name + '…', 'info');

    try {
        const res = await sendRequest({ ticks: idx.code, subscribe: 1 });
        if (res.subscription) {
            state.ticksSubscriptionId = res.subscription.id;
            log('✅ Abonné à ' + idx.name, 'success');
        }
        if (res.tick && res.tick.symbol) {
            markIndexActive(res.tick.symbol);
            showTick(res.tick);
        }
    } catch (e) {
        log('❌ Erreur : ' + e.message, 'error');
        markIndexTested(idx.code, false);
    }
}

function showTick(tick) {
    const box = $('ticks-box');
    box.classList.add('visible');
    const list = $('ticks-list');

    const row = document.createElement('div');
    row.className = 'tick-row';
    const time = new Date(tick.epoch * 1000).toLocaleTimeString('fr-FR');
    row.innerHTML =
        '<span class="tick-quote">' + tick.quote + '</span>' +
        '<span class="tick-time">' + time + '</span>';
    list.insertBefore(row, list.firstChild);
    while (list.children.length > 15) list.removeChild(list.lastChild);
}

// ══════════════════════════════════════════════════════════════════
// ÉVÉNEMENTS
// ══════════════════════════════════════════════════════════════════
$('family-select').addEventListener('change', (e) => {
    const key = e.target.value;
    if (!key) {
        $('family-info').style.display = 'none';
        $('index-section').style.display = 'none';
        return;
    }
    state.selectedFamily = key;
    const fam = SYNTHETIC_FAMILIES[key];
    $('family-info').style.display = 'block';
    $('family-info').innerHTML = '<strong>' + fam.icon + ' ' + fam.name + '</strong> — ' + fam.indices.length + ' indices';
    $('index-section').style.display = 'block';
    renderIndexList(key);
});

$('btn-test-all').addEventListener('click', () => {
    if (!state.selectedFamily) return;
    const fam = SYNTHETIC_FAMILIES[state.selectedFamily];
    log('🧪 Test manuel : ' + fam.name, 'info');
    for (const idx of fam.indices) {
        if (!state.activeIndices[idx.code]?.active) testIndex(idx.code);
    }
});

log('🧪 Deriv WebSocket Étape 2 (v2) — Prêt', 'info');
log('📋 ' + Object.keys(SYNTHETIC_FAMILIES).length + ' familles chargées', 'info');
setStatus('', 'Déconnecté', 'Clique sur Connecter');
renderFamilySelect();

window.addEventListener('load', () => {
    setTimeout(() => { connect(); }, 500);
});
</script>
